                                <span key={r.id} className="group inline-flex items-center gap-1 pl-1.5 pr-1 py-1 rounded-full bg-white border border-slate-200 text-[10px] font-bold text-slate-500">
                                    <RatingDot rating={r.rating} />{r.date.slice(5)}
                                    <button onClick={() => onDelete(r.id)} className="ml-0.5 text-slate-300 hover:text-rose-500">×</button>
                                </span>
                            ))}
                        </div>
                    )}

                    <details className="mt-3">
                        <summary className="text-xs font-bold text-indigo-600 cursor-pointer select-none">키워드·메모로 자세히 기록하기</summary>
                        <div className="mt-2 space-y-2">
                            <CategorySelect categories={categories} value={form.category} onChange={c => setForm({ ...form, category: c })} onAddCategory={onAddCategory} />
                            <TagPicker selected={form.tags} onToggle={onToggleTag} subject={data.subject} />
                            {form.tags.length > 0 && (
                                <div className="flex flex-wrap gap-1">
                                    {form.tags.map(t => <span key={t} className="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full border border-indigo-100">{t}</span>)}
                                </div>
                            )}
                            <textarea value={form.content} onChange={e => setForm({ ...form, content: e.target.value })} rows="2" placeholder="추가 메모 (선택)" className="w-full border rounded-lg px-3 py-1.5 text-sm" />
                            <button onClick={onAdd} className="bg-indigo-600 text-white text-xs font-bold px-4 py-1.5 rounded-lg hover:bg-indigo-700">기록 저장</button>
                        </div>
                    </details>

                    {detailed.length > 0 && (
                        <div className="mt-3 space-y-1.5">
                            {detailed.slice(0, 6).map(r => (
                                <div key={r.id} className="flex justify-between items-start bg-white rounded-lg p-2 border border-slate-100 text-xs">
                                    <div>
                                        <span className="text-slate-400 font-bold mr-1">{r.date}</span>
                                        <RatingDot rating={r.rating} />
                                        {(r.tags || []).map(t => <span key={t} className="inline-block bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded-full mr-1 ml-1">{t}</span>)}
                                        {r.content && <span className="text-slate-700">{r.content}</span>}
                                    </div>
                                    <button onClick={() => onDelete(r.id)} className="text-rose-500 hover:underline ml-2 shrink-0">삭제</button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function ByRoundRecord({ data, updateData, focusGroupId, onFocusHandled }) {
            const rounds = data.rounds;
            const [roundId, setRoundId] = useState(rounds[0]?.id || '');
            useEffect(() => { if (!rounds.find(r => r.id === roundId)) setRoundId(rounds[0]?.id || ''); }, [rounds]);
            const round = rounds.find(r => r.id === roundId);
            const [date, setDate] = useState(todayStr());
            const [groupForm, setGroupForm] = useState({});
            const [selectedMemberId, setSelectedMemberId] = useState(null);
            const [indivForm, setIndivForm] = useState({ category: '', tags: [], content: '' });
            const [sessionNoteText, setSessionNoteText] = useState('');
            const [sessionLesson, setSessionLesson] = useState('');
            const [highlightGroupId, setHighlightGroupId] = useState(null);

            useEffect(() => { setSelectedMemberId(null); }, [roundId]);

            // 교실 배치도에서 모둠 손잡이를 탭했을 때: 그 모둠이 속한 회차로 전환하고,
            // 해당 모둠 카드로 스크롤 + 잠깐 강조 표시.
            useEffect(() => {
                if (!focusGroupId) return;
                const owningRound = rounds.find(r => r.groups.some(g => g.id === focusGroupId));
                if (owningRound && owningRound.id !== roundId) setRoundId(owningRound.id);
                setHighlightGroupId(focusGroupId);
                if (onFocusHandled) onFocusHandled();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [focusGroupId]);

            useEffect(() => {
                if (!highlightGroupId) return;
                const el = document.getElementById(`group-card-${highlightGroupId}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const t = setTimeout(() => setHighlightGroupId(null), 1800);
                return () => clearTimeout(t);
            }, [highlightGroupId]);

            if (rounds.length === 0) return <p className="text-sm text-slate-500">먼저 모둠 배정 탭에서 회차를 만들어주세요.</p>;

            const addGroupRecord = (groupId) => {
                const content = (groupForm[groupId] || '').trim();
                if (!content) return;
                updateData(prev => ({ ...prev, groupRecords: [{ id: uid(), roundId, groupId, date, content, createdAt: Date.now() }, ...prev.groupRecords] }));
                setGroupForm({ ...groupForm, [groupId]: '' });
            };
            const deleteGroupRecord = (id) => updateData(prev => ({ ...prev, groupRecords: prev.groupRecords.filter(r => r.id !== id) }));

            const quickRate = (studentId, rating) => {
                if (!rating) return;
                updateData(prev => ({ ...prev, individualRecords: [{ id: uid(), studentId, roundId, date, category: '', tags: [], rating, content: '', createdAt: Date.now() }, ...prev.individualRecords] }));
            };
            const addIndivRecord = (studentId) => {
                if (!indivForm.content.trim() && indivForm.tags.length === 0) return;
                updateData(prev => ({ ...prev, individualRecords: [{ id: uid(), studentId, roundId, date, category: indivForm.category, tags: indivForm.tags, rating: null, content: indivForm.content.trim(), createdAt: Date.now() }, ...prev.individualRecords] }));
                setIndivForm({ category: '', tags: [], content: '' });
            };
            const toggleTag = (tag) => setIndivForm(f => ({ ...f, tags: f.tags.includes(tag) ? f.tags.filter(t => t !== tag) : [...f.tags, tag] }));
            const deleteIndivRecord = (id) => updateData(prev => ({ ...prev, individualRecords: prev.individualRecords.filter(r => r.id !== id) }));
            const setLeader = (groupId, studentId) => updateData(prev => ({ ...prev, rounds: prev.rounds.map(r => r.id === roundId ? { ...r, groups: r.groups.map(g => g.id === groupId ? { ...g, leaderId: g.leaderId === studentId ? null : studentId } : g) } : r) }));
            const addCategory = (name) => updateData(prev => ({ ...prev, categories: prev.categories.includes(name) ? prev.categories : [...prev.categories, name] }));

            const sessionNotes = data.sessionNotes.filter(n => n.roundId === roundId).sort((a, b) => b.createdAt - a.createdAt);
            const addSessionNote = () => {
                if (!sessionNoteText.trim()) return;
                const lessonTag = sessionLesson.trim();
                const content = sessionNoteText.trim();
                updateData(prev => {
                    const next = { ...prev, sessionNotes: [{ id: uid(), roundId, date, lesson: lessonTag || null, content, createdAt: Date.now() }, ...prev.sessionNotes] };
                    if (lessonTag) next.progress = upsertLesson(next.progress || [], lessonTag, content);
                    return next;
                });
                setSessionNoteText('');
            };
            const deleteSessionNote = (id) => updateData(prev => ({ ...prev, sessionNotes: prev.sessionNotes.filter(n => n.id !== id) }));

            return (
                <div>
                    <div className="flex flex-wrap gap-2 mb-4">
                        <select value={roundId} onChange={e => setRoundId(e.target.value)} className="border rounded-lg px-3 py-2 text-sm flex-1 min-w-[160px]">
                            {rounds.map(r => <option key={r.id} value={r.id}>{r.name} ({r.date})</option>)}
                        </select>
                        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="border rounded-lg px-3 py-2 text-sm" />
                    </div>

                    {round && (
                        <div className="mb-5 p-4 bg-indigo-50 border border-indigo-100 rounded-2xl">
                            <p className="text-xs font-bold text-indigo-700 mb-2">오늘 수업에서 한 활동 (반 전체)</p>
                            <div className="flex gap-2">
                                <div className="flex items-center border rounded-lg bg-white w-28 shrink-0 overflow-hidden">
                                    <button type="button" onClick={() => setSessionLesson(String((parseInt(sessionLesson, 10) || 0) - 1))} className="px-2.5 py-2 text-slate-500 font-bold hover:bg-slate-100 border-r">−</button>
                                    <input value={sessionLesson} onChange={e => setSessionLesson(e.target.value)} placeholder="차시" className="flex-1 min-w-0 text-center px-1 py-2 text-sm outline-none" />
                                    <button type="button" onClick={() => setSessionLesson(String((parseInt(sessionLesson, 10) || 0) + 1))} className="px-2.5 py-2 text-slate-500 font-bold hover:bg-slate-100 border-l">＋</button>
                                </div>
                                <input value={sessionNoteText} onChange={e => setSessionNoteText(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') addSessionNote(); }}
                                    placeholder="예: 3개의 프렛 안에서 도~도 옥타브 연주 연습" className="flex-1 min-w-0 border rounded-lg px-3 py-2 text-sm" />
                                <button onClick={addSessionNote} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-700 shrink-0">저장</button>
                            </div>
                            <p className="text-[11px] text-slate-400 mt-1">차시를 입력하면 진도기록에도 같은 내용으로 자동 저장돼요.</p>
                            {sessionNotes.length > 0 && (
                                <div className="mt-2 space-y-1">
                                    {sessionNotes.map(n => (
                                        <div key={n.id} className="flex justify-between items-start bg-white rounded-lg p-2 border border-indigo-100 text-xs">
                                            <div>
                                                <span className="text-slate-400 font-bold mr-1">{n.date}</span>
                                                {n.lesson && <span className="text-indigo-600 font-bold mr-1">{n.lesson}차시</span>}
                                                <span className="text-slate-700">{n.content}</span>
                                            </div>
                                            <button onClick={() => deleteSessionNote(n.id)} className="text-rose-500 hover:underline ml-2 shrink-0">삭제</button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {round && (
                        <div className="space-y-4">
                            {round.groups.map((g, idx) => {
                                const pal = paletteFor(idx);
                                const gRecords = data.groupRecords.filter(r => r.roundId === round.id && r.groupId === g.id).sort((a, b) => b.createdAt - a.createdAt);
                                const members = g.memberIds.map(id => data.students.find(s => s.id === id)).filter(Boolean);
                                return (
                                    <div key={g.id} id={`group-card-${g.id}`}
                                        className={`border-2 rounded-2xl bg-white overflow-hidden transition-shadow ${pal.border} ${highlightGroupId === g.id ? 'ring-4 ring-indigo-300' : ''}`}>
                                        <div className={`flex items-center gap-2 px-4 py-2.5 ${pal.bg}`}>
                                            <span className={`w-2.5 h-2.5 rounded-full ${pal.dot}`}></span>
                                            <h4 className={`font-bold text-sm ${pal.text}`}>{g.name}</h4>
                                            {g.leaderId && <span className="text-xs text-slate-500">· 조장 {studentLabel(data.students, g.leaderId)}</span>}
                                        </div>
                                        <div className="p-4">
                                            <div className="flex flex-wrap gap-1.5 mb-3">
                                                {members.map(m => {
                                                    const ratingDots = data.individualRecords
                                                        .filter(r => r.studentId === m.id && r.rating)
                                                        .sort((a, b) => a.createdAt - b.createdAt)
                                                        .map(r => r.rating)
                                                        .slice(-10);
                                                    return (
                                                        <MemberChip key={m.id} student={m} isLeader={g.leaderId === m.id}
                                                            selected={selectedMemberId === m.id} ratingDots={ratingDots}
                                                            onClick={() => setSelectedMemberId(selectedMemberId === m.id ? null : m.id)} />
                                                    );
                                                })}
                                                {members.length === 0 && <span className="text-xs text-slate-300">구성원 없음</span>}
                                            </div>

                                            <div className="flex flex-wrap gap-2 mb-2">
                                                <textarea value={groupForm[g.id] || ''} onChange={e => setGroupForm({ ...groupForm, [g.id]: e.target.value })} placeholder="모둠 전체 활동 기록" rows="2" className="flex-1 min-w-[200px] border rounded-lg px-3 py-1.5 text-sm" />
                                                <button onClick={() => addGroupRecord(g.id)} className="bg-indigo-600 text-white text-xs font-bold px-4 py-1.5 rounded-lg hover:bg-indigo-700 self-start">모둠 기록 추가</button>
                                            </div>
                                            {gRecords.length > 0 && (
                                                <div className="space-y-1.5 mb-1">
                                                    {gRecords.map(r => (
                                                        <div key={r.id} className="flex justify-between items-start bg-slate-50 rounded-lg p-2 border border-slate-100 text-xs">
                                                            <div><span className="text-slate-400 font-bold mr-1">{r.date}</span><span className="text-slate-700">{r.content}</span></div>
                                                            <button onClick={() => deleteGroupRecord(r.id)} className="text-rose-500 hover:underline ml-2 shrink-0">삭제</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {members.filter(m => m.id === selectedMemberId).map(m => (
                                                <IndivPanel key={m.id} student={m} data={data} categories={data.categories} onAddCategory={addCategory}
                                                    isLeader={g.leaderId === m.id} onToggleLeader={() => setLeader(g.id, m.id)}
                                                    onQuickRate={(rating) => quickRate(m.id, rating)}
                                                    onMarkAbsent={() => quickRate(m.id, 'absent')}
                                                    form={indivForm} setForm={setIndivForm} onToggleTag={toggleTag}
                                                    onAdd={() => addIndivRecord(m.id)} onDelete={deleteIndivRecord} />
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        function StudentRecordPanel({ student, data, updateData }) {
            const records = data.individualRecords.filter(r => r.studentId === student.id).sort((a, b) => b.createdAt - a.createdAt);
            const quickRatings = records.filter(r => r.rating && !r.content && (r.tags || []).length === 0);
            const detailed = records.filter(r => !(r.rating && !r.content && (r.tags || []).length === 0));
            const [form, setForm] = useState({ category: '', date: todayStr(), roundId: '', rating: null, tags: [], content: '' });
            const [copyMsg, setCopyMsg] = useState('');

            const addRecord = () => {
                if (!form.content.trim() && form.tags.length === 0 && !form.rating) return;
                updateData(prev => ({ ...prev, individualRecords: [{ id: uid(), studentId: student.id, category: form.category, date: form.date || todayStr(), roundId: form.roundId || null, rating: form.rating, tags: form.tags, content: form.content.trim(), createdAt: Date.now() }, ...prev.individualRecords] }));
                setForm({ ...form, rating: null, tags: [], content: '' });
            };
            const toggleTag = (tag) => setForm(f => ({ ...f, tags: f.tags.includes(tag) ? f.tags.filter(t => t !== tag) : [...f.tags, tag] }));
            const deleteRecord = (id) => updateData(prev => ({ ...prev, individualRecords: prev.individualRecords.filter(r => r.id !== id) }));
            const addCategory = (name) => updateData(prev => ({ ...prev, categories: prev.categories.includes(name) ? prev.categories : [...prev.categories, name] }));

            const copySelectedText = async () => {
                try {
                    await copyToClipboard(formatStudentRecordText(student, records));
                    setCopyMsg('복사되었습니다!');
                } catch (e) {
                    setCopyMsg('복사에 실패했습니다: ' + e.message);
                }
                setTimeout(() => setCopyMsg(''), 2500);
            };

            return (
                <div className="p-3 bg-slate-50 border-t border-slate-100">
                    <div className="flex justify-end items-center mb-2">
                        <button onClick={copySelectedText} className="text-xs bg-white border border-slate-200 px-3 py-1.5 rounded-lg font-bold hover:bg-slate-100">📋 텍스트로 복사하기</button>
                    </div>
                    {copyMsg && <p className="text-xs text-emerald-600 mb-2 text-right">{copyMsg}</p>}
                    <div className="p-3 bg-white border border-slate-200 rounded-xl mb-3 space-y-2">
                        <div className="flex flex-wrap gap-2">
                            <CategorySelect categories={data.categories} value={form.category} onChange={c => setForm({ ...form, category: c })} onAddCategory={addCategory} />
                            <input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} className="border rounded-lg px-2 py-1.5 text-xs" />
                            <select value={form.roundId} onChange={e => setForm({ ...form, roundId: e.target.value })} className="border rounded-lg px-2 py-1.5 text-xs">
                                <option value="">관련 회차 없음</option>
                                {data.rounds.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                            </select>
                        </div>
                        <RatingButtons value={form.rating} onChange={(v) => setForm({ ...form, rating: v })} />
                        <TagPicker selected={form.tags} onToggle={toggleTag} subject={data.subject} />

                                    <div className="mt-1">
                                        {(r.tags || []).map(t => <span key={t} className="inline-block text-[10px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded-full mr-1 mb-1">{t}</span>)}

                        {records.length === 0 && <p className="text-xs text-slate-300">기록 없음</p>}
                    </div>
                </div>
            );
        }

        function ByStudentRecord({ data, updateData }) {
            const students = useMemo(() => [...data.students].sort(byNumberThenName), [data.students]);
            const [expandedId, setExpandedId] = useState(null);
            const [search, setSearch] = useState('');
            const [bulkCopyMsg, setBulkCopyMsg] = useState('');

            const filteredStudents = students.filter(s => s.name.includes(search) || String(s.number).includes(search));

            const copyAllText = async () => {
                const parts = students
                    .map(s => ({ s, recs: data.individualRecords.filter(r => r.studentId === s.id) }))
                    .filter(({ recs }) => recs.length)
                    .map(({ s, recs }) => formatStudentRecordText(s, recs));
                if (!parts.length) { setBulkCopyMsg('복사할 기록이 없습니다.'); setTimeout(() => setBulkCopyMsg(''), 2500); return; }
                try {
                    await copyToClipboard(parts.join('\n\n---\n\n'));
                    setBulkCopyMsg(`전체 학생(${parts.length}명) 기록을 복사했습니다.`);
                } catch (e) {
                    setBulkCopyMsg('복사에 실패했습니다: ' + e.message);
                }
                setTimeout(() => setBulkCopyMsg(''), 3000);
            };

            return (
                <div>
                    <input value={search} onChange={e => setSearch(e.target.value)} placeholder="학생 검색" className="w-full border rounded-lg px-3 py-2 text-sm mb-2" />
                    <button onClick={copyAllText} className="w-full text-xs bg-indigo-50 text-indigo-700 px-3 py-2 rounded-lg font-bold border border-indigo-100 hover:bg-indigo-100 mb-1">📋 전체 학생 기록 한 번에 복사</button>
                    {bulkCopyMsg && <p className="text-xs text-emerald-600 mb-3">{bulkCopyMsg}</p>}
                    <div className="border border-slate-200 rounded-xl bg-white overflow-hidden">
                        {filteredStudents.map(s => {
                            const ratingDots = data.individualRecords
                                .filter(r => r.studentId === s.id && r.rating)
                                .sort((a, b) => a.createdAt - b.createdAt)
                                .map(r => r.rating)
                                .slice(-10);
                            return (
                                <div key={s.id} className="border-b border-slate-50 last:border-b-0">
                                    <button onClick={() => setExpandedId(expandedId === s.id ? null : s.id)}
                                        className={`w-full text-left px-3 py-2.5 text-sm hover:bg-slate-50 flex items-center justify-between gap-2 ${expandedId === s.id ? 'bg-indigo-50 text-indigo-700 font-bold' : ''}`}>
                                        <span className="flex items-center gap-2 min-w-0">
                                            <span className="truncate">{s.number ? `${s.number} ` : ''}{s.name}</span>
                                            {ratingDots.length > 0 && (
                                                <span className="flex items-center gap-[2px] shrink-0">
                                                    {ratingDots.map((r, i) => <RatingDot key={i} rating={r} />)}
                                                </span>
                                            )}
                                        </span>
                                        <span className="text-slate-300 text-xs shrink-0">{expandedId === s.id ? '▲' : '▼'}</span>
                                    </button>
                                    {expandedId === s.id && <StudentRecordPanel student={s} data={data} updateData={updateData} />}
                                </div>
                            );
                        })}
                        {filteredStudents.length === 0 && <p className="text-xs text-slate-400 p-3">학생이 없습니다.</p>}
                    </div>
                </div>
            );
        }

        function RecordTab({ data, updateData, focusGroupId, onFocusHandled }) {
            const [mode, setMode] = useState('byRound');
            useEffect(() => { if (focusGroupId) setMode('byRound'); }, [focusGroupId]);

            return (
                <div>

                            <button onClick={() => setMode('byStudent')} className={`px-3 py-1.5 rounded-md ${mode === 'byStudent' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600'}`}>학생별 전체보기</button>

                    </div>
                    {mode === 'byRound' ? <ByRoundRecord data={data} updateData={updateData} focusGroupId={focusGroupId} onFocusHandled={onFocusHandled} /> : <ByStudentRecord data={data} updateData={updateData} />}

            );

        // ---------------------------------------------------------------
        // Progress (진도) tab
        // ---------------------------------------------------------------
        function sortLessons(list) {
            return [...list].sort((a, b) => {
                const na = parseFloat(a.lesson), nb = parseFloat(b.lesson);
                if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
                return (a.lesson || '').localeCompare(b.lesson || '', 'ko');
            });
        }

        // Upsert a progress (진도) entry by lesson number. `detail` is optional —
        // omit it to leave an existing entry's detail memo untouched (used when
        // syncing in from a whole-class activity note, which has no detail of its
        // own). Never stores a literal `undefined`: Firestore's SDK throws
        // synchronously on an undefined field value, which previously crashed the
        // whole app when "전체 적용" carried an entry with no detail set yet.
        function upsertLesson(list, lesson, content, detail) {
            const existing = list.find(p => p.lesson === lesson);
            if (existing) {
                const nextDetail = detail === undefined ? (existing.detail || '') : (detail || '');
                return list.map(p => p.id === existing.id ? { ...p, content, detail: nextDetail, updatedAt: Date.now() } : p);
            }
            return [...list, { id: uid(), lesson, content, detail: detail || '', updatedAt: Date.now() }];
        }

        function ProgressTab({ data, updateData, classCode, classCodes, fetchAllProgress, applyLessonToAllClasses }) {
            const [mode, setMode] = useState('mine');
            const [form, setForm] = useState({ lesson: '', content: '' });
            const [editingId, setEditingId] = useState(null);
            const [applyMsg, setApplyMsg] = useState('');
            const [compareData, setCompareData] = useState(null);
            const [loadingCompare, setLoadingCompare] = useState(false);
            const [expandedLessonId, setExpandedLessonId] = useState(null);
            const [detailDraft, setDetailDraft] = useState('');

            const progress = data.progress || [];
            const sorted = sortLessons(progress);

            const resetForm = () => { setForm({ lesson: '', content: '' }); setEditingId(null); };

            const submit = (e) => {
                e.preventDefault();
                if (!form.lesson.trim()) return;
                updateData(prev => {
                    const list = prev.progress || [];
                    if (editingId) {
                        return { ...prev, progress: list.map(p => p.id === editingId ? { ...p, lesson: form.lesson.trim(), content: form.content, updatedAt: Date.now() } : p) };
                    }
                    const existing = list.find(p => p.lesson === form.lesson.trim());
                    if (existing) {
                        return { ...prev, progress: list.map(p => p.id === existing.id ? { ...p, content: form.content, updatedAt: Date.now() } : p) };
                    }
                    return { ...prev, progress: [...list, { id: uid(), lesson: form.lesson.trim(), content: form.content, updatedAt: Date.now() }] };
                });
                resetForm();
            };

            const startEdit = (p) => { setForm({ lesson: p.lesson, content: p.content }); setEditingId(p.id); };
            const remove = (id) => {
                if (!window.confirm('이 차시 기록을 삭제할까요?')) return;
                updateData(prev => ({ ...prev, progress: (prev.progress || []).filter(p => p.id !== id) }));
                if (editingId === id) resetForm();
            };

            const applyToAll = async (p) => {
                setApplyMsg('적용 중...');
                const count = await applyLessonToAllClasses({ lesson: p.lesson, content: p.content, detail: p.detail });
                setApplyMsg(`${count}개 학급에 적용했습니다.`);
                setTimeout(() => setApplyMsg(''), 3000);
            };

            const openDetail = (p) => {
                if (expandedLessonId === p.id) { setExpandedLessonId(null); return; }
                setExpandedLessonId(p.id);
                setDetailDraft(p.detail || '');
            };

            const saveDetail = (p) => {
                updateData(prev => ({ ...prev, progress: (prev.progress || []).map(x => x.id === p.id ? { ...x, detail: detailDraft, updatedAt: Date.now() } : x) }));
                setExpandedLessonId(null);
            };

            const loadCompare = async () => {
                setLoadingCompare(true);
                const result = await fetchAllProgress();
                setCompareData(result);
                setLoadingCompare(false);
            };

            useEffect(() => {
                if (mode === 'compare') loadCompare();
            }, [mode]);

            const allLessons = useMemo(() => {
                if (!compareData) return [];
                const set = new Set();
                Object.values(compareData).forEach(list => (list || []).forEach(p => set.add(p.lesson)));
                return sortLessons([...set].map(lesson => ({ lesson }))).map(x => x.lesson);
            }, [compareData]);

            return (
                <div>
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                        <h3 className="text-lg font-bold text-slate-900">
                            <InlineEditText value={data.progressTitle || '진도 기록'} onChange={v => updateData(prev => ({ ...prev, progressTitle: v.trim() || '진도 기록' }))} />
                        </h3>
                        <div className="flex bg-slate-100 rounded-lg p-1 text-xs font-medium">
                            <button onClick={() => setMode('mine')} className={`px-3 py-1.5 rounded-md ${mode === 'mine' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600'}`}>이 학급 진도</button>
                            <button onClick={() => setMode('compare')} className={`px-3 py-1.5 rounded-md ${mode === 'compare' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600'}`}>전체 학급 비교</button>
                        </div>
                    </div>

                    {mode === 'mine' ? (
                        <div>
                            <form onSubmit={submit} className="border border-slate-200 rounded-xl p-3 mb-4 bg-slate-50">
                                <div className="flex flex-col sm:flex-row gap-2 mb-2">
                                    <div className="flex items-center border rounded-lg sm:w-32 shrink-0 overflow-hidden">
                                        <button type="button" onClick={() => setForm(f => ({ ...f, lesson: String((parseInt(f.lesson, 10) || 0) - 1) }))} className="px-3 py-2 text-slate-500 font-bold hover:bg-slate-100 border-r">−</button>
                                        <input value={form.lesson} onChange={e => setForm({ ...form, lesson: e.target.value })} placeholder="차시" className="flex-1 min-w-0 text-center px-1 py-2 text-sm outline-none" />
                                        <button type="button" onClick={() => setForm(f => ({ ...f, lesson: String((parseInt(f.lesson, 10) || 0) + 1) }))} className="px-3 py-2 text-slate-500 font-bold hover:bg-slate-100 border-l">＋</button>
                                    </div>
                                    <input value={form.content} onChange={e => setForm({ ...form, content: e.target.value })} placeholder="이번 차시 진도/활동 내용" className="flex-1 border rounded-lg px-3 py-2 text-sm" />
                                </div>
                                <div className="flex justify-end gap-2">
                                    {editingId && <button type="button" onClick={resetForm} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500">취소</button>}
                                    <button type="submit" className="text-xs bg-indigo-600 text-white px-4 py-1.5 rounded-lg font-bold hover:bg-indigo-700">{editingId ? '수정 저장' : '+ 추가'}</button>
                                </div>
                            </form>
                            {applyMsg && <p className="text-xs text-emerald-600 mb-2">{applyMsg}</p>}
                            <div className="space-y-2">
                                {sorted.map(p => (
                                    <div key={p.id} className="border border-slate-200 rounded-xl p-3">
                                        <div className="flex items-start justify-between gap-2">
                                            <div className="min-w-0 cursor-pointer" onClick={() => openDetail(p)}>
                                                <span className="text-xs font-bold text-indigo-600">{p.lesson}차시</span>
                                                <p className="text-sm text-slate-700 whitespace-pre-wrap break-words mt-0.5">{p.content || <span className="text-slate-300">내용 없음</span>}</p>
                                                {p.detail && expandedLessonId !== p.id && (
                                                    <p className="text-xs text-slate-400 mt-1 truncate">📝 {p.detail}</p>
                                                )}
                                            </div>
                                            <div className="flex gap-1 shrink-0">
                                                <button onClick={() => applyToAll(p)} className="text-xs px-2 py-1 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50">🔁 전체 적용</button>
                                                <button onClick={() => startEdit(p)} className="text-xs px-2 py-1 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50">수정</button>
                                                <button onClick={() => remove(p.id)} className="text-xs px-2 py-1 rounded-lg border border-slate-200 text-rose-500 hover:bg-rose-50">삭제</button>
                                            </div>
                                        </div>
                                        {expandedLessonId === p.id && (
                                            <div className="mt-3 pt-3 border-t border-slate-100">
                                                <textarea value={detailDraft} onChange={e => setDetailDraft(e.target.value)} rows="4"
                                                    placeholder="이 차시에 대한 더 자세한 메모 (수업 중 특이사항, 다음에 참고할 점 등)"
                                                    className="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500" />
                                                <div className="flex justify-end gap-2 mt-2">
                                                    <button onClick={() => setExpandedLessonId(null)} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500">닫기</button>
                                                    <button onClick={() => saveDetail(p)} className="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-indigo-700">저장</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {sorted.length === 0 && <p className="text-sm text-slate-400">아직 등록된 진도가 없습니다.</p>}
                            </div>
                        </div>
                    ) : (
                        <div>
                            <div className="flex items-center justify-between mb-2 gap-2">
                                <p className="text-xs text-slate-500">저장된 시점의 스냅샷이에요. 최신 내용을 보려면 새로고침하세요.</p>
                                <button onClick={loadCompare} disabled={loadingCompare} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 font-bold text-indigo-600 hover:bg-indigo-50 shrink-0">{loadingCompare ? '불러오는 중...' : '↻ 새로고침'}</button>
                            </div>
                            {compareData && allLessons.length > 0 ? (
                                <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                    <table className="min-w-full text-xs">
                                        <thead className="bg-slate-50">
                                            <tr>
                                                <th className="px-3 py-2 text-left font-bold text-slate-500 sticky left-0 bg-slate-50">학급</th>
                                                {allLessons.map(lesson => (
                                                    <th key={lesson} className="px-3 py-2 text-left font-bold whitespace-nowrap text-slate-500">{lesson}차시</th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {classCodes.map(code => (
                                                <tr key={code} className="border-t border-slate-100">
                                                    <td className={`px-3 py-2 font-bold whitespace-nowrap sticky left-0 bg-white ${code === classCode ? 'text-indigo-600' : 'text-slate-700'}`}>{code}{code === classCode ? ' (현재)' : ''}</td>
                                                    {allLessons.map(lesson => {
                                                        const entry = (compareData[code] || []).find(p => p.lesson === lesson);
                                                        return (
                                                            <td key={lesson} className="px-3 py-2 max-w-[14rem] truncate text-slate-600" title={entry ? entry.content : ''}>
                                                                {entry ? (entry.content || <span className="text-slate-300">(내용 없음)</span>) : <span className="text-slate-200">—</span>}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            ) : (
                                <p className="text-sm text-slate-400">{loadingCompare ? '불러오는 중...' : '비교할 진도 기록이 없습니다.'}</p>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // ---------------------------------------------------------------
        // Settings tab
        // ---------------------------------------------------------------
        function SettingsTab({ classCode, firebaseConfigText, setFirebaseConfigText, applyFirebaseConfig, connected, syncError, googleClientId, setGoogleClientId, google, data, updateData }) {
            const [exportBusy, setExportBusy] = useState(false);
            const [exportMsg, setExportMsg] = useState('');
            const fileInputRef = useRef(null);

            const doExport = async () => {
                if (!google.token) { google.signIn(); return; }
                setExportBusy(true); setExportMsg('');
                try {
                    const { url } = await exportToSheet(google.token, data, '모둠·생기부 기록');
                    setExportMsg('내보내기 완료: ' + url);
                } catch (e) { setExportMsg(e.message); }
                finally { setExportBusy(false); }
            };

            const removeCategory = (name) => updateData(prev => ({ ...prev, categories: prev.categories.filter(c => c !== name) }));

            const backupJson = () => downloadFile(`모둠생기부_백업_${todayStr()}.json`, JSON.stringify(data, null, 2));
            const restoreJson = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        if (!window.confirm('현재 데이터를 백업 파일 내용으로 덮어씁니다. 계속할까요?')) return;
                        updateData(() => ({ ...DEFAULT_DATA, ...parsed }));
                    } catch (err) { alert('올바른 백업 파일이 아닙니다.'); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="space-y-8 max-w-2xl">
                    <section>
                        <h3 className="text-lg font-bold text-slate-900 mb-2">🔄 여러 기기 동기화 (Firebase)</h3>
                        <p className="text-xs text-slate-500 mb-3">Firebase 프로젝트를 만들고 Firestore 설정을 붙여넣으면, 같은 학급 코드를 쓰는 모든 기기(PC·태블릿·휴대폰)에서 실시간으로 데이터가 동기화됩니다. 설정하지 않아도 이 브라우저에서는 계속 사용할 수 있어요.</p>
                        <p className="text-xs text-slate-400 mb-2">Firebase 콘솔의 "SDK 설정 및 구성" 코드 스니펫을 <code className="bg-slate-100 px-1 rounded">&lt;script&gt;</code> 태그까지 통째로 복사해서 붙여넣어도 됩니다. firebaseConfig 부분만 알아서 찾아 씁니다.</p>
                        <textarea value={firebaseConfigText} onChange={e => setFirebaseConfigText(e.target.value)} rows="6" placeholder='Firebase 콘솔의 코드 스니펫 전체(또는 firebaseConfig = {...} 부분)를 붙여넣으세요' className="w-full border rounded-lg px-3 py-2 text-xs font-mono" />
                        <div className="flex items-center gap-2 mt-2">
                            <button onClick={applyFirebaseConfig} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-700">적용</button>
                            <span className={`text-xs font-bold ${connected ? 'text-emerald-600' : 'text-slate-400'}`}>{connected ? '● 연결됨' : '○ 미연결(로컬 저장 모드)'}</span>
                        </div>
                        {syncError && (
                            <p className="text-xs text-rose-600 bg-rose-50 border border-rose-100 rounded-lg px-3 py-2 mt-2">⚠️ {syncError}</p>

        function ClassSwitcher({ classCode, classCodes, onSwitch, onCreate, onRemove, onRename }) {
            const [open, setOpen] = useState(false);
            const [newCode, setNewCode] = useState('');
            const [editingCode, setEditingCode] = useState(null);
            const [editValue, setEditValue] = useState('');

            const create = () => {
                const code = newCode.trim();
                if (!code) return;
                onCreate(code);
                setNewCode('');
                setOpen(false);
            };
            const startEdit = (code) => { setEditingCode(code); setEditValue(code); };
            const commitEdit = () => {
                if (editingCode) onRename(editingCode, editValue);
                setEditingCode(null);
                setEditValue('');
            };

            return (
                <div className="relative">
                    <button onClick={() => setOpen(!open)} className="flex items-center gap-1 bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1.5 rounded-full font-semibold border border-indigo-100">

                                            <div key={code} className="flex items-center gap-1 px-2 py-1.5 bg-slate-50">
                                                <input autoFocus value={editValue} onChange={e => setEditValue(e.target.value)}
                                                    onKeyDown={e => { if (e.key === 'Enter') commitEdit(); if (e.key === 'Escape') setEditingCode(null); }}
                                                    className="flex-1 border rounded-lg px-2 py-1 text-xs outline-none focus:border-indigo-500" />
                                                <button onClick={commitEdit} className="text-xs bg-indigo-600 text-white px-2 py-1 rounded-lg font-bold">저장</button>

                                            <div key={code} className={`flex items-center justify-between hover:bg-slate-50 ${code === classCode ? 'bg-indigo-50' : ''}`}>

                                                <button onClick={(e) => { e.stopPropagation(); onRemove(code); }} className="px-2 text-slate-300 hover:text-rose-500 text-xs">×</button>
                                            </div>
                                        )
                                    ))}
                                </div>
                                <div className="border-t border-slate-100 p-2 flex gap-1">
                                    <input value={newCode} onChange={e => setNewCode(e.target.value)}
                                        onKeyDown={e => { if (e.key === 'Enter') create(); }}

        function App() {
            seedDemoClassIfFirstVisit();
            const [classCode, setClassCode] = useState(localStorage.getItem('sga_classCode') || 'default');
            const [classCodes, setClassCodes] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('sga_classCodes') || '[]');
                    const current = localStorage.getItem('sga_classCode') || 'default';
                    return saved.includes(current) ? saved : [...saved, current];
                } catch (e) { return ['default']; }
            });
            const [firebaseConfigText, setFirebaseConfigText] = useState(localStorage.getItem('sga_firebaseConfig') || '');
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sga_firebaseConfig') || 'null'); } catch (e) { return null; }
            });
            const [googleClientId, setGoogleClientIdState] = useState(localStorage.getItem('sga_googleClientId') || '');
            const [db, setDb] = useState(null);
            const [connected, setConnected] = useState(false);
            const [syncError, setSyncError] = useState('');
            const [data, setData] = useState(DEFAULT_DATA);
            const [dataReady, setDataReady] = useState(false);
            // Edits made in the brief window before a class's real cloud data has
            // loaded (dataReady === false) are queued here instead of being synced
            // (and then silently lost when the real snapshot overwrites them) — see
            // updateData and the exists-branch below, which replays this queue on
            // top of the freshly loaded data as soon as it arrives.
            const pendingUpdatesRef = useRef([]);
            const [activeTab, setActiveTab] = useState('record');
            const [focusGroupId, setFocusGroupId] = useState(null);
            const [showHelp, setShowHelp] = useState(false);
            const [installPrompt, setInstallPrompt] = useState(null);
            const [isStandalone, setIsStandalone] = useState(false);
            const isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent) && !window.MSStream;

            useEffect(() => {
                setIsStandalone(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);
                const onBeforeInstall = (e) => { e.preventDefault(); setInstallPrompt(e); };
                window.addEventListener('beforeinstallprompt', onBeforeInstall);
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js').catch(() => {});
                }
                return () => window.removeEventListener('beforeinstallprompt', onBeforeInstall);
            }, []);

            const triggerInstall = async () => {
                if (!installPrompt) return;
                installPrompt.prompt();
                await installPrompt.userChoice;
                setInstallPrompt(null);
            };

            const google = useGoogleAuth(googleClientId);

            const setGoogleClientId = (val) => { setGoogleClientIdState(val); localStorage.setItem('sga_googleClientId', val); };

            const applyFirebaseConfig = () => {
                try {
                    const parsed = parseFirebaseConfigInput(firebaseConfigText);
                    setSyncError('');
                    setFirebaseConfig(parsed);
                    localStorage.setItem('sga_firebaseConfig', parsed ? JSON.stringify(parsed) : '');
                } catch (e) { alert(e.message); }
            };

            useEffect(() => {
                if (!firebaseConfig) { setDb(null); setConnected(false); return; }
                let cancelled = false;
                try {
                    window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(firebaseConfig);
                    const auth = window.firebase.auth();
                    const unsubAuth = auth.onAuthStateChanged(user => {
                        if (cancelled) return;
                        if (user) { setSyncError(''); setDb(window.firebase.firestore()); }
                    });
                    auth.signInAnonymously().catch(err => {
                        if (cancelled) return;
                        setConnected(false);
                        setSyncError('Firebase 로그인 실패: ' + err.message + ' — Authentication에서 "익명" 로그인이 켜져 있는지 확인하세요.');
                    });
                    return () => { cancelled = true; unsubAuth(); };
                } catch (e) {
                    console.error(e);
                    setDb(null);
                    setConnected(false);
                    setSyncError('Firebase 설정 오류: ' + e.message);
                }
            }, [firebaseConfig]);

            useEffect(() => {
                if (!db || !classCode) return;
                let cancelled = false;
                setData(DEFAULT_DATA);
                setDataReady(false);
                pendingUpdatesRef.current = [];
                const docRef = db.collection('classes').doc(classCode);
                // One-time, server-authoritative check: only seed the cloud doc from
                // this device's localStorage if the class genuinely has no cloud copy
                // yet. This must NEVER happen inside the onSnapshot listener below —
                // its very first callback can be served from an empty/stale local
                // cache (e.g. this device has simply never opened this class before)
                // and report `exists: false` even though the class has real data on
                // the server, which would silently wipe it with a blank `.set()`.
                // Forcing `source: 'server'` here means this check is only ever
                // trusted when it actually reached Firestore.
                docRef.get({ source: 'server' }).then(snap => {
                    if (cancelled || snap.exists) return;
                    const raw = localStorage.getItem(`sga_data_${classCode}`);
                    const seed = raw ? { ...DEFAULT_DATA, ...JSON.parse(raw) } : DEFAULT_DATA;
                    docRef.set(seed).catch(err => console.error('initial sync seed failed', err));
                }).catch(err => console.error('server existence check failed', err));
                const unsub = docRef.onSnapshot(
                    snap => {
                        if (cancelled) return;
                        setConnected(true);
                        setSyncError('');
                        // Only accept a snapshot that actually has content — an
                        // `exists: false` reading (from cache, mid-seed, or a blip)
                        // is never grounds to blank out what's on screen or, worse,
                        // to be treated as "loaded" and let updateData below sync a
                        // blank document over real cloud data.
                        if (snap.exists) {
                            let merged = { ...DEFAULT_DATA, ...snap.data() };
                            if (pendingUpdatesRef.current.length) {
                                // Replay edits the teacher made while this class's data
                                // was still loading, on top of the now-authoritative
                                // server data, then push the result back up — instead
                                // of letting this snapshot silently overwrite them.
                                merged = pendingUpdatesRef.current.reduce(
                                    (acc, updater) => (typeof updater === 'function' ? updater(acc) : updater),
                                    merged
                                );
                                pendingUpdatesRef.current = [];
                                try {
                                    const safe = JSON.parse(JSON.stringify(merged));
                                    docRef.set(safe).catch(err => console.error('pending sync replay failed', err));
                                } catch (err) { console.error('pending sync replay failed', err); }
                            }
                            setData(merged);
                            setDataReady(true);
                        }
                    },
                    err => {
                        if (cancelled) return;
                        console.error(err);
                        setConnected(false);
                        setSyncError('동기화 실패: ' + err.message + ' — Firestore Database를 만들었는지, 보안 규칙을 게시했는지 확인하세요.');
                    }
                );
                return () => { cancelled = true; unsub(); };
            }, [db, classCode]);

            useEffect(() => {
                if (db) return;
                const raw = localStorage.getItem(`sga_data_${classCode}`);
                setData(raw ? { ...DEFAULT_DATA, ...JSON.parse(raw) } : DEFAULT_DATA);
                setDataReady(true);
            }, [classCode, db]);

            const updateData = (updater) => {
                setData(prev => {
                    const next = typeof updater === 'function' ? updater(prev) : updater;
                    if (db && classCode) {
                        if (!dataReady) {
                            // This class's real cloud data hasn't been confirmed loaded
                            // yet (we're still mid-switch or mid-seed). Never sync straight
                            // away — it could permanently overwrite real data with
                            // whatever placeholder is on screen right now. Instead, queue
                            // this edit; the effect above replays it on top of the real
                            // data the moment it arrives, so it isn't lost.
                            pendingUpdatesRef.current.push(updater);
                            return next;
                        }
                        try {
                            // Firestore's SDK throws synchronously (not just a rejected
                            // promise) on a field value of `undefined`. A JSON round-trip
                            // drops those keys, so a slip elsewhere never crashes the app.
                            const safe = JSON.parse(JSON.stringify(next));
                            db.collection('classes').doc(classCode).set(safe).catch(err => console.error('sync write failed', err));
                        } catch (err) {
                            console.error('sync write failed', err);
                        }
                    } else {
                        localStorage.setItem(`sga_data_${classCode}`, JSON.stringify(next));
                    }
                    return next;
                });
            };

            const goToGroupRecord = (groupId) => {
                setFocusGroupId(groupId);
                setActiveTab('record');
            };

            const switchClass = (code) => {
                setClassCode(code);
                localStorage.setItem('sga_classCode', code);
                setActiveTab('record');
            };
            const createClass = (code) => {
                setClassCodes(prev => {
                    if (prev.includes(code)) return prev;
                    const next = [...prev, code];
                    localStorage.setItem('sga_classCodes', JSON.stringify(next));
                    return next;
                });
                switchClass(code);
            };
            const removeClassCode = (code) => {
                if (!window.confirm(`'${code}' 학급을 목록에서 삭제할까요? (저장된 데이터는 남아있어서 같은 이름으로 다시 추가하면 복구돼요)`)) return;
                const next = classCodes.filter(c => c !== code);
                if (code === classCode) {
                    const fallback = next[0] || 'default';
                    if (!next.includes(fallback)) next.push(fallback);
                    setClassCode(fallback);
                    localStorage.setItem('sga_classCode', fallback);
                }
                setClassCodes(next);
                localStorage.setItem('sga_classCodes', JSON.stringify(next));
            };

            const renameClassCode = async (oldCode, newCodeRaw) => {
                const newCode = newCodeRaw.trim();
                if (!newCode || newCode === oldCode) return;
                if (classCodes.includes(newCode)) { alert(`'${newCode}' 학급이 이미 있어요. 다른 이름을 써주세요.`); return; }
                try {
                    if (db) {
                        const oldRef = db.collection('classes').doc(oldCode);
                        // Must read the server's authoritative copy, not the local
                        // cache — a stale/empty cached read here (e.g. renaming a
                        // class this device hasn't actively synced) would make us
                        // copy blank data to the new name and then permanently
                        // delete the real old document below.
                        const snap = await oldRef.get({ source: 'server' });
                        const oldData = snap.exists ? snap.data() : DEFAULT_DATA;
                        await db.collection('classes').doc(newCode).set(oldData);
                        await oldRef.delete();
                    } else {
                        const raw = localStorage.getItem(`sga_data_${oldCode}`);
                        if (raw) {
                            localStorage.setItem(`sga_data_${newCode}`, raw);
                            localStorage.removeItem(`sga_data_${oldCode}`);
                        }
                    }
                    const next = classCodes.map(c => c === oldCode ? newCode : c);
                    setClassCodes(next);
                    localStorage.setItem('sga_classCodes', JSON.stringify(next));
                    if (classCode === oldCode) {
                        setClassCode(newCode);
                        localStorage.setItem('sga_classCode', newCode);
                    }
                } catch (e) {
                    alert('학급 이름 변경 중 문제가 발생했습니다: ' + e.message);
                }
            };

            useEffect(() => {
                setClassCodes(prev => {
                    if (prev.includes(classCode)) return prev;
                    const next = [...prev, classCode];
                    localStorage.setItem('sga_classCodes', JSON.stringify(next));
                    return next;
                });
            }, [classCode]);

            // 여러 학급의 명단(+모둠)을 한 번에 등록: classGroups = { [학급코드]: { students, groups, roundName } }.
            // 지금 보고 있는 학급은 화면에 바로 반영되도록 updateData를 쓰고, 나머지 학급은 각자의
            // 저장소(Firestore 문서 또는 localStorage 항목)에 기존 데이터와 합쳐서 직접 써 준다.
            const mergeClassImport = (base, imported) => {
                const existingByNumber = new Map(base.students.filter(s => s.number).map(s => [s.number, s]));
                const newStudents = imported.students.filter(s => !s.number || !existingByNumber.has(s.number));
                const next = { ...base, students: [...base.students, ...newStudents] };
                if (imported.groups && imported.groups.length) {
                    const resolveId = (parsedId) => {
                        const ps = imported.students.find(s => s.id === parsedId);
                        if (!ps) return parsedId;
                        if (ps.number && existingByNumber.has(ps.number)) return existingByNumber.get(ps.number).id;
                        return ps.id;
                    };
                    const groups = imported.groups.map(g => ({ ...g, memberIds: g.memberIds.map(resolveId), leaderId: null }));
                    next.rounds = [{ id: uid(), name: imported.roundName || `가져온 모둠`, date: todayStr(), groups, createdAt: Date.now() }, ...base.rounds];
                }
                return { next, addedCount: newStudents.length };
            };

            const bulkCreateClasses = async (classGroups) => {
                const codes = Object.keys(classGroups).filter(c => c && classGroups[c].students.length);
                const summary = [];
                for (const code of codes) {
                    const imported = classGroups[code];
                    if (code === classCode) {
                        let addedCount = 0;
                        updateData(prev => {
                            const { next, addedCount: n } = mergeClassImport(prev, imported);
                            addedCount = n;
                            return next;
                        });
                        summary.push({ code, count: addedCount });
                        continue;
                    }
                    try {
                        let base = DEFAULT_DATA;
                        if (db) {
                            // Must read from the server, not the local cache — a stale
                            // or empty cached read here (e.g. this device has never
                            // opened that class before) would make `base` look emptier
                            // than it really is, and the .set() below would then
                            // permanently overwrite that class's real cloud data.
                            const snap = await db.collection('classes').doc(code).get({ source: 'server' });
                            if (snap.exists) base = { ...DEFAULT_DATA, ...snap.data() };
                        } else {
                            const raw = localStorage.getItem(`sga_data_${code}`);
                            if (raw) base = { ...DEFAULT_DATA, ...JSON.parse(raw) };
                        }
                        const { next, addedCount } = mergeClassImport(base, imported);
                        if (db) await db.collection('classes').doc(code).set(next);
                        else localStorage.setItem(`sga_data_${code}`, JSON.stringify(next));
                        summary.push({ code, count: addedCount });
                    } catch (e) {
                        summary.push({ code, count: 0, error: e.message });
                    }
                }
                setClassCodes(prev => {
                    const merged = [...new Set([...prev, ...codes])];
                    localStorage.setItem('sga_classCodes', JSON.stringify(merged));
                    return merged;
                });
                return summary;
            };

            const fetchAllProgress = async () => {
                const result = {};
                for (const code of classCodes) {
                    if (code === classCode) { result[code] = data.progress || []; continue; }
                    try {
                        if (db) {
                            const snap = await db.collection('classes').doc(code).get();
                            result[code] = snap.exists ? (snap.data().progress || []) : [];
                        } else {
                            const raw = localStorage.getItem(`sga_data_${code}`);
                            result[code] = raw ? (JSON.parse(raw).progress || []) : [];
                        }
                    } catch (e) {
                        result[code] = [];
                    }
                }
                return result;
            };

            const applyLessonToAllClasses = async ({ lesson, content, detail }) => {
                let count = 0;
                for (const code of classCodes) {
                    if (code === classCode) {
                        updateData(prev => ({ ...prev, progress: upsertLesson(prev.progress || [], lesson, content, detail) }));
                        count++;
                        continue;
                    }
                    try {
                        let base = DEFAULT_DATA;
                        if (db) {
                            // Same reasoning as bulkCreateClasses: read the server's
                            // authoritative copy, never the local cache, before this
                            // merges and overwrites the whole document.
                            const snap = await db.collection('classes').doc(code).get({ source: 'server' });
                            if (snap.exists) base = { ...DEFAULT_DATA, ...snap.data() };
                        } else {
                            const raw = localStorage.getItem(`sga_data_${code}`);
                            if (raw) base = { ...DEFAULT_DATA, ...JSON.parse(raw) };
                        }
                        const next = { ...base, progress: upsertLesson(base.progress || [], lesson, content, detail) };
                        if (db) await db.collection('classes').doc(code).set(next);
                        else localStorage.setItem(`sga_data_${code}`, JSON.stringify(next));
                        count++;
                    } catch (e) {
                        console.error('apply progress failed for', code, e);
                    }
                }
                return count;
            };

            const TABS = [
                { id: 'classroom', label: '교실', icon: '🏫' },
                { id: 'roster', label: '명단관리', icon: '👥' },
                { id: 'record', label: '활동기록', icon: '📝' },
                { id: 'progress', label: '진도기록', icon: '📚' },
            ];

            return (
                <div className="min-h-screen bg-slate-50">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-1.5 sm:gap-2 shrink-0 min-w-0">
                                <span className="text-xl sm:text-2xl shrink-0">🧩</span>
                                <h1 className="text-sm sm:text-xl font-bold text-indigo-600 truncate">모둠 활동 도우미</h1>
                            </div>
                            <div className="flex-1 flex justify-center min-w-0">
                                <ClassSwitcher classCode={classCode} classCodes={classCodes} onSwitch={switchClass} onCreate={createClass} onRemove={removeClassCode} onRename={renameClassCode} />
                            </div>
                            <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                                <span className={`hidden sm:inline text-xs font-bold whitespace-nowrap ${connected ? 'text-emerald-600' : firebaseConfig ? 'text-rose-500' : 'text-slate-400'}`}>
                                    {connected ? '● 동기화됨' : firebaseConfig ? '● 연결 안 됨' : '○ 이 기기에만 저장'}
                                </span>
                                <span className={`sm:hidden inline-block w-2.5 h-2.5 rounded-full ${connected ? 'bg-emerald-500' : firebaseConfig ? 'bg-rose-500' : 'bg-slate-300'}`}
                                    title={connected ? '동기화됨' : firebaseConfig ? '연결 안 됨' : '이 기기에만 저장'}></span>
                                <button onClick={() => setShowHelp(true)}
                                    className="w-6 h-6 sm:w-7 sm:h-7 flex items-center justify-center rounded-full border border-slate-300 text-slate-400 hover:text-indigo-600 hover:border-indigo-300 text-xs sm:text-sm font-bold leading-none"
                                    title="설명서">?</button>
                                <button onClick={() => setActiveTab('settings')}
                                    className={`text-lg sm:text-xl leading-none ${activeTab === 'settings' ? 'text-indigo-600' : 'text-slate-400 hover:text-indigo-600'}`}
                                    title="설정">⚙️</button>
                            </div>
                        </div>
                    </header>

                    {db && classCode && !dataReady && !syncError && (
                        <div className="bg-indigo-50 border-b border-indigo-100 text-indigo-700 text-xs text-center py-1.5">
                            ☁️ '{classCode}' 학급 데이터를 불러오는 중...
                        </div>
                    )}
                    {syncError && (
                        <div className="bg-rose-50 border-b border-rose-100 text-rose-600 text-xs text-center py-1.5 px-3">
                            ⚠️ {syncError}
                        </div>
                    )}

                    {showHelp && (
                        <HelpModal onClose={() => setShowHelp(false)}
                            isStandalone={isStandalone} isIOS={isIOS}
                            installPrompt={installPrompt} onInstall={triggerInstall} />
                    )}

                    <main className="max-w-6xl mx-auto px-3 sm:px-4 py-4 sm:py-6 pb-24 sm:pb-6">
                        <div className="hidden sm:flex border-b border-slate-200 mb-6 overflow-x-auto whitespace-nowrap">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`px-5 py-3 border-b-2 font-medium text-sm transition-all ${activeTab === tab.id ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-slate-500'}`}>
                                    {tab.icon} {tab.label}
                                </button>
                            ))}
                        </div>

                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-3 sm:p-6">
                            {activeTab === 'classroom' && <ClassroomTab data={data} updateData={updateData} onGroupClick={goToGroupRecord} />}
                            {activeTab === 'roster' && <RosterTab data={data} updateData={updateData} google={{ ...google, clientId: googleClientId }} bulkCreateClasses={bulkCreateClasses} />}
                            {activeTab === 'progress' && <ProgressTab data={data} updateData={updateData} classCode={classCode} classCodes={classCodes} fetchAllProgress={fetchAllProgress} applyLessonToAllClasses={applyLessonToAllClasses} />}
                            {activeTab === 'record' && <RecordTab data={data} updateData={updateData} focusGroupId={focusGroupId} onFocusHandled={() => setFocusGroupId(null)} />}
                            {activeTab === 'settings' && (
                                <SettingsTab
                                    classCode={classCode}
                                    firebaseConfigText={firebaseConfigText}
                                    setFirebaseConfigText={setFirebaseConfigText}
                                    applyFirebaseConfig={applyFirebaseConfig}
                                    connected={connected}
                                    syncError={syncError}
                                    googleClientId={googleClientId}
                                    setGoogleClientId={setGoogleClientId}
                                    google={google}
                                    data={data}
                                    updateData={updateData}
                                />
                            )}
                        </div>
                    </main>

                    <nav className="sm:hidden fixed bottom-0 inset-x-0 z-50 bg-white border-t border-slate-200 flex" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
                        {TABS.map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                className={`flex-1 flex flex-col items-center justify-center gap-0.5 py-2.5 text-[11px] font-bold ${activeTab === tab.id ? 'text-indigo-600' : 'text-slate-400'}`}>
                                <span className="text-lg leading-none">{tab.icon}</span>
                                {tab.label}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
