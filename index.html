        function seedDemoClassIfFirstVisit() {
            try {
                if (localStorage.getItem('sga_classCodes') !== null) return; // not a fresh install

        }
        const shuffle = (arr) => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };
        const byNumberThenName = (a, b) => {
            const an = Number(a.number), bn = Number(b.number);
            if (!isNaN(an) && !isNaN(bn) && an !== bn) return an - bn;
            return a.name.localeCompare(b.name, 'ko');
        };

        // ---------------------------------------------------------------
        // Conditional group auto-assignment: fills only the currently
        // unassigned students into the existing groups (so manually
        // pre-placed students — leaders, students who need separating —
        // stay put), choosing each student's group by a per-condition
        // scoring function that always picks the group where they fit best.
        // ---------------------------------------------------------------
        const ASSIGN_MODES = [
            { id: 'random', label: '완전 랜덤' },
            { id: 'gender', label: '남녀 성비 균등' },
            { id: 'score', label: '이전 성적 골고루' },
            { id: 'genderScore', label: '성별 + 성적 균형' },
            { id: 'mix', label: '최대한 섞기 (이전 모둠과 안 겹치게)' },
        ];

        function genderKey(g) {
            const v = (g || '').trim();
            if (/^(남|남자|boy|m|male)$/i.test(v)) return 'M';
            if (/^(여|여자|girl|f|female)$/i.test(v)) return 'F';
            return v ? v : '?';
        }

        function computeCoOccurrence(rounds) {
            const map = {};
            rounds.forEach(r => {
                r.groups.forEach(g => {
                    const ids = g.memberIds;
                    for (let i = 0; i < ids.length; i++) {
                        for (let j = i + 1; j < ids.length; j++) {
                            const a = ids[i], b = ids[j];
                            (map[a] = map[a] || {})[b] = (map[a][b] || 0) + 1;
                            (map[b] = map[b] || {})[a] = (map[b][a] || 0) + 1;
                        }
                    }
                });
            });
            return map;
        }

        // Returns { groups, unassigned: [] } — groups are copies with the
        // previously-unassigned students added according to `mode`.
        function autoAssignUnassigned(draft, students, mode, rounds) {
            const byId = Object.fromEntries(students.map(s => [s.id, s]));
            const groups = draft.groups.map(g => ({ ...g, memberIds: [...g.memberIds] }));
            let order = shuffle(draft.unassigned);
            let scoreFn;

            if (mode === 'gender') {
                scoreFn = (g, sid) => {
                    const gk = genderKey(byId[sid].gender);
                    const same = g.memberIds.filter(id => byId[id] && genderKey(byId[id].gender) === gk).length;
                    return same * 1000 + g.memberIds.length + Math.random() * 0.01;
                };
            } else if (mode === 'score') {
                order = order.slice().sort((a, b) => (Number(byId[b].score) || 0) - (Number(byId[a].score) || 0));
                scoreFn = (g) => g.memberIds.reduce((sum, id) => sum + (byId[id] ? Number(byId[id].score) || 0 : 0), 0) + Math.random() * 0.01;
            } else if (mode === 'genderScore') {
                order = order.slice().sort((a, b) => (Number(byId[b].score) || 0) - (Number(byId[a].score) || 0));
                scoreFn = (g, sid) => {
                    const gk = genderKey(byId[sid].gender);
                    const same = g.memberIds.filter(id => byId[id] && genderKey(byId[id].gender) === gk).length;
                    const scoreSum = g.memberIds.reduce((sum, id) => sum + (byId[id] ? Number(byId[id].score) || 0 : 0), 0);
                    return same * 100000 + scoreSum + Math.random() * 0.01;
                };
            } else if (mode === 'mix') {
                const co = computeCoOccurrence(rounds || []);
                scoreFn = (g, sid) => {
                    let total = 0;
                    g.memberIds.forEach(id => { total += (co[sid] && co[sid][id]) || 0; });
                    return total * 1000 + g.memberIds.length + Math.random() * 0.01;
                };
            } else {
                scoreFn = (g) => g.memberIds.length + Math.random() * 0.01;
            }

            order.forEach(sid => {
                let best = groups[0], bestVal = Infinity;
                groups.forEach(g => {
                    const v = scoreFn(g, sid);
                    if (v < bestVal) { bestVal = v; best = g; }
                });
                if (best) best.memberIds.push(sid);
            });

            return { groups, unassigned: [] };
        }
        const downloadFile = (filename, content, mime = 'application/json') => {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        };

        async function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
                return;
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }

        }

        // ---------------------------------------------------------------
        // Google Identity Services + Sheets API (loaded lazily, no build step)
        // ---------------------------------------------------------------
        let gisLoadPromise = null;
        function loadGis() {
            if (gisLoadPromise) return gisLoadPromise;
            gisLoadPromise = new Promise((resolve, reject) => {
                if (window.google && window.google.accounts) return resolve();
                const s = document.createElement('script');
                s.src = 'https://accounts.google.com/gsi/client';
                s.async = true;
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('Google 스크립트 로드 실패'));
                document.head.appendChild(s);
            });
            return gisLoadPromise;
        }

        function useGoogleAuth(clientId) {
            const [token, setToken] = useState(null);
            const [ready, setReady] = useState(false);
            const [error, setError] = useState('');
            const tokenClientRef = useRef(null);

            useEffect(() => {
                setToken(null);
                setReady(false);
                setError('');
                if (!clientId) return;
                let cancelled = false;
                loadGis().then(() => {
                    if (cancelled) return;
                    try {
                        tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
                            client_id: clientId,
                            scope: 'https://www.googleapis.com/auth/spreadsheets',
                            callback: (resp) => {
                                if (resp && resp.access_token) setToken(resp.access_token);
                                else setError('Google 인증에 실패했습니다.');
                            },
                        });
                        setReady(true);
                    } catch (e) {
                        setError('Google 인증 초기화 실패: ' + e.message);
                    }
                }).catch(e => setError(e.message));
                return () => { cancelled = true; };
            }, [clientId]);

            const signIn = () => {
                if (!tokenClientRef.current) return;
                tokenClientRef.current.requestAccessToken({ prompt: token ? '' : 'consent' });
            };
            const signOut = () => setToken(null);

            return { token, ready, error, signIn, signOut };
        }

        function InlineEditText({ value, onChange, placeholder = '', className = '', title }) {
            const [editing, setEditing] = useState(false);

            useEffect(() => { if (!editing) setVal(value || ''); }, [value, editing]);
            useEffect(() => { if (editing && inputRef.current) inputRef.current.focus(); }, [editing]);

            const commit = () => {
                setEditing(false);
                if (val !== (value || '')) onChange(val);
            };

            if (editing) {
                return (
                    <input ref={inputRef} value={val} onChange={e => setVal(e.target.value)}
                        onBlur={commit}
                        onKeyDown={e => {
                            if (e.key === 'Enter') commit();
                            if (e.key === 'Escape') { setVal(value || ''); setEditing(false); }
                        }}
                        placeholder={placeholder}
                        className="border rounded-lg px-2 py-1 text-sm outline-none focus:border-indigo-500 w-full" />
                );

        function parseImportedSheet(rows) {
            if (!rows || !rows.length) return { students: [], groups: [], roundName: '' };
            const norm = (v) => (v === null || v === undefined) ? '' : String(v).trim();
            const hasHeader = rows[0].some(c => norm(c) === '이름');
            let header, dataRows;
            if (hasHeader) {
                header = rows[0].map(norm);
                dataRows = rows.slice(1);
            } else {
                header = rows[0].length >= 9
                    ? ['모둠', '학번', '이름', '학생 특성', '기타경험', '지식점수', 'MBTI', '선호역할', '배정사유']
                    : ['모둠', '학번', '이름', '기타경험', '지식점수', 'MBTI', '선호역할', '배정사유'];
                dataRows = rows;
            }
            const col = (label) => header.findIndex(h => h.includes(label));
            const idxGroup = col('모둠'), idxNumber = col('학번'), idxName = col('이름');
            const idxTrait = col('특성'), idxExp = col('경험'), idxReason = col('사유');

            let roundName = '';
            if (hasHeader) {
                const lastKnownIdx = Math.max(idxGroup, idxNumber, idxName, idxTrait, idxExp, idxReason);
                const extra = header.slice(lastKnownIdx + 1).find(h => h && h.length > 4);
                if (extra) roundName = extra.replace(/\s+/g, ' ').trim();
            }

            const students = [];
            const groupMap = new Map();
            dataRows.forEach(row => {
                const name = idxName !== -1 ? norm(row[idxName]) : '';
                if (!name || name === '이름') return;
                const rawGroup = idxGroup !== -1 ? row[idxGroup] : null;
                const groupName = (rawGroup === null || rawGroup === undefined || rawGroup === '') ? null
                    : (typeof rawGroup === 'number' ? `${rawGroup}조` : norm(rawGroup));
                const number = idxNumber !== -1 ? norm(row[idxNumber]) : '';
                const experience = idxExp !== -1 ? norm(row[idxExp]) : '';
                const trait = idxTrait !== -1 ? norm(row[idxTrait]) : '';
                const reason = idxReason !== -1 ? norm(row[idxReason]) : '';
                const memo = [trait, experience, reason].filter(Boolean).join(' / ');

                const student = { id: uid(), number, name, gender: '', memo };
                students.push(student);
                if (groupName) {
                    if (!groupMap.has(groupName)) groupMap.set(groupName, []);
                    groupMap.get(groupName).push(student.id);
                }
            });
            const groups = [...groupMap.entries()].map(([name, memberIds]) => ({ id: uid(), name, memberIds, leaderId: null }));
            return { students, groups, roundName };
        }

        // "학급, 번호, 이름" (또는 "학급, 이름") 형식으로 여러 학급의 명단을 한 번에 붙여넣을 때 사용.
        // 첫 필드(학급)별로 묶어서 { [classCode]: { students, groups: [], roundName: '' } } 형태로 돌려준다.
        function parseMultiClassPaste(text) {
            const byClass = {};
            text.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
                const parts = line.split(/[\t,]+/).map(s => s.trim()).filter(s => s !== '');
                if (parts.length < 2) return;
                const classCode = parts[0];
                let number = '', name = '', memo = '';
                if (parts.length >= 3 && /^\d+$/.test(parts[1])) {
                    number = parts[1]; name = parts[2]; memo = parts[3] || '';
                } else {
                    name = parts[1]; memo = parts[2] || '';
                }
                if (!classCode || !name) return;
                if (!byClass[classCode]) byClass[classCode] = { students: [], groups: [], roundName: '' };
                byClass[classCode].students.push({ id: uid(), number, name, gender: '', memo });
            });
            return byClass;
        }

        function buildSheetRows(data) {
            const rosterRows = [
                ['번호', '이름', '성별', '메모'],
                ...[...data.students].sort(byNumberThenName).map(s => [s.number || '', s.name, s.gender || '', s.memo || '']),
            ];
            const assignRows = [['회차', '날짜', '모둠명', '조장', '구성원']];
            data.rounds.forEach(r => {
                r.groups.forEach(g => {
                    assignRows.push([r.name, r.date, g.name, g.leaderId ? studentLabel(data.students, g.leaderId) : '', g.memberIds.map(id => studentLabel(data.students, id)).join(', ')]);
                });
            });
            const roundById = Object.fromEntries(data.rounds.map(r => [r.id, r]));
            const groupRows = [['회차', '모둠명', '날짜', '기록내용']];
            data.groupRecords.forEach(rec => {
                const round = roundById[rec.roundId];
                const group = round && round.groups.find(g => g.id === rec.groupId);
                groupRows.push([round ? round.name : '(삭제된 회차)', group ? group.name : '(삭제된 모둠)', rec.date, rec.content]);
            });
            const indivRows = [['이름', '구분', '날짜', '평가', '키워드', '관련회차', '기록내용']];
            data.individualRecords.forEach(rec => {
                const round = roundById[rec.roundId];
                indivRows.push([studentLabel(data.students, rec.studentId), rec.category || '', rec.date, rec.rating ? RATING_META[rec.rating].label : '', (rec.tags || []).join(', '), round ? round.name : '', rec.content]);
            });
            const sessionRows = [['회차', '날짜', '수업 활동 내용']];
            (data.sessionNotes || []).forEach(n => {
                const round = roundById[n.roundId];
                sessionRows.push([round ? round.name : '(삭제된 회차)', n.date, n.content]);
            });
            return { '명단': rosterRows, '모둠배정': assignRows, '모둠기록': groupRows, '개인기록': indivRows, '수업활동': sessionRows };
        }

        async function sheetsFetch(token, url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers || {}) },
            });
            if (!res.ok) {
                const text = await res.text().catch(() => res.statusText);
                throw new Error(`Google Sheets 요청 실패 (${res.status}): ${text}`);
            }
            return res.json();
        }

        async function exportToSheet(token, data, titlePrefix) {
            const created = await sheetsFetch(token, 'https://sheets.googleapis.com/v4/spreadsheets', {
                method: 'POST',
                body: JSON.stringify({
                    properties: { title: `${titlePrefix} ${new Date().toLocaleDateString('ko-KR')}` },
                    sheets: Object.keys(buildSheetRows(DEFAULT_DATA)).map(title => ({ properties: { title } })),
                }),
            });
            const spreadsheetId = created.spreadsheetId;
            const sheetsData = buildSheetRows(data);
            for (const [sheetName, rows] of Object.entries(sheetsData)) {
                const range = encodeURIComponent(`${sheetName}!A1`);
                await sheetsFetch(token, `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?valueInputOption=RAW`, {
                    method: 'PUT',
                    body: JSON.stringify({ range: `${sheetName}!A1`, majorDimension: 'ROWS', values: rows }),
                });
            }
            return { spreadsheetId, url: created.spreadsheetUrl };
        }

        function extractSpreadsheetId(input) {
            const m = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
            return m ? m[1] : input.trim();
        }

        // Firebase 콘솔의 "복사" 버튼은 순수 JSON이 아니라 import문·주석·initializeApp 호출까지
        // 포함된 전체 <script> 스니펫을 복사해준다. 그 안에서 firebaseConfig = { ... } 객체만
        // 중괄호 짝을 맞춰 잘라낸 뒤, JSON 또는 자바스크립트 객체 리터럴로 해석한다.
        function extractBalancedObject(text, startIdx) {
            let depth = 0, inString = null;
            for (let i = startIdx; i < text.length; i++) {
                const ch = text[i];
                if (inString) {
                    if (ch === '\\') { i++; continue; }
                    if (ch === inString) inString = null;
                    continue;
                }
                if (ch === '"' || ch === "'" || ch === '`') { inString = ch; continue; }
                if (ch === '{') depth++;
                else if (ch === '}') {
                    depth--;
                    if (depth === 0) return text.slice(startIdx, i + 1);
                }
            }
            return null;
        }

        function parseFirebaseConfigInput(text) {
            const trimmed = text.trim();
            if (!trimmed) return null;

            const named = trimmed.match(/firebaseConfig\s*(?::\s*[\w.<>\[\]]+)?\s*=\s*\{/);
            let candidate;
            if (named) {
                candidate = extractBalancedObject(trimmed, named.index + named[0].length - 1);
            }
            if (!candidate) {
                candidate = trimmed
                    .replace(/^(export\s+)?(const|let|var)\s+\w+\s*=\s*/, '')
                    .replace(/;\s*$/, '')
                    .trim();
            }

            let obj;
            try {
                obj = JSON.parse(candidate);
            } catch (jsonErr) {
                try {
                    obj = new Function('"use strict"; return (' + candidate + ');')();
                } catch (jsErr) {
                    throw new Error('Firebase 설정 값을 해석하지 못했습니다. Firebase 콘솔의 코드 스니펫 전체(또는 firebaseConfig 객체 부분)를 그대로 붙여넣어 보세요.');
                }
            }
            if (!obj || typeof obj !== 'object' || !obj.apiKey || !obj.projectId) {
                throw new Error('apiKey와 projectId가 포함된 firebaseConfig 객체를 찾지 못했습니다. Firebase 콘솔의 코드 스니펫 전체를 그대로 붙여넣어 보세요.');
            }
            return obj;
        }

        async function importRosterFromSheet(token, sheetIdOrUrl, range) {
            const spreadsheetId = extractSpreadsheetId(sheetIdOrUrl);
            const json = await sheetsFetch(token, `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(range)}`);
            const rows = json.values || [];
            if (!rows.length) return [];
            const looksLikeHeader = /번호|이름|name/i.test((rows[0] || []).join(''));
            const dataRows = looksLikeHeader ? rows.slice(1) : rows;
            return dataRows.filter(r => r.length && r[0]).map((r, idx) => {
                const [c0, c1, c2, c3] = r;
                if (c1 !== undefined && c1 !== '' && /^\d+$/.test(String(c0).trim())) {
                    return { id: uid(), number: String(c0).trim(), name: String(c1).trim(), gender: c2 || '', memo: c3 || '' };
                }
                return { id: uid(), number: String(idx + 1), name: String(c0).trim(), gender: c1 || '', memo: c2 || '' };
            }).filter(s => s.name);
        }

        // ---------------------------------------------------------------
        // Roster tab
        // ---------------------------------------------------------------
        function RosterTab({ data, updateData, google, bulkCreateClasses }) {
            const emptyForm = { number: '', name: '', gender: '', score: '', memo: '' };
            const [form, setForm] = useState(emptyForm);
            const [pasteText, setPasteText] = useState('');
            const [showPaste, setShowPaste] = useState(false);
            const [sheetInput, setSheetInput] = useState('');
            const [sheetRange, setSheetRange] = useState('시트1!A1:D100');
            const [busy, setBusy] = useState(false);
            const [msg, setMsg] = useState('');
            const [workbook, setWorkbook] = useState(null); // { fileName, sheets: { name: rows[][] } }
            const [selectedSheet, setSelectedSheet] = useState('');
            const [xlsxMsg, setXlsxMsg] = useState('');
            const [bulkPasteText, setBulkPasteText] = useState('');
            const [bulkBusy, setBulkBusy] = useState(false);
            const [bulkMsg, setBulkMsg] = useState('');
            const [manageGroups, setManageGroups] = useState(false);
            const [showAddForm, setShowAddForm] = useState(false);
            const [quickName, setQuickName] = useState('');
            const fileRef = useRef(null);

            const quickAdd = (e) => {
                e.preventDefault();
                const name = quickName.trim();
                if (!name) return;
                updateData(prev => ({ ...prev, students: [...prev.students, { id: uid(), number: '', name, gender: '', score: '', memo: '' }] }));
                setQuickName('');
            };

            const formatBulkSummary = (summary) => {
                const ok = summary.filter(s => !s.error);
                const failed = summary.filter(s => s.error);
                let text = `${ok.length}개 학급을 만들었습니다: ` + ok.map(s => `${s.code}(${s.count}명)`).join(', ');
                if (failed.length) text += ` / 실패: ` + failed.map(s => s.code).join(', ');
                return text;
            };

            const applyMultiClassPaste = async () => {
                const groups = parseMultiClassPaste(bulkPasteText);
                if (!Object.keys(groups).length) { setBulkMsg('인식된 학급이 없습니다. "학급, 번호, 이름" 형식으로 입력했는지 확인하세요.'); return; }
                setBulkBusy(true); setBulkMsg('');
                const summary = await bulkCreateClasses(groups);
                setBulkBusy(false);
                setBulkPasteText('');
                setBulkMsg(formatBulkSummary(summary));
            };

            const importAllSheetsAsClasses = async () => {
                if (!workbook) return;
                const groups = {};
                Object.entries(workbook.sheets).forEach(([name, rows]) => {
                    const parsed = parseImportedSheet(rows);
                    if (parsed.students.length) groups[name] = parsed;
                });
                if (!Object.keys(groups).length) { setXlsxMsg('가져올 학생 정보가 있는 시트를 찾지 못했습니다.'); return; }
                setBulkBusy(true);
                const summary = await bulkCreateClasses(groups);
                setBulkBusy(false);
                setXlsxMsg(formatBulkSummary(summary));
            };

            const [sortMode, setSortMode] = useState('number');
            const latestRound = data.rounds && data.rounds[0];
            const groupInfoById = useMemo(() => {
                const map = {};
                if (latestRound) {
                    latestRound.groups.forEach((g, gi) => {
                        g.memberIds.forEach((id, mi) => { map[id] = { groupIdx: gi, groupName: g.name, orderInGroup: mi }; });
                    });
                }
                return map;
            }, [latestRound]);

            const students = useMemo(() => {
                const byNumber = [...data.students].sort(byNumberThenName);
                if (sortMode !== 'group') return byNumber;
                // Array.prototype.sort is stable, so students with no group (or an
                // equal group ranking) keep their existing 번호순 order.
                return [...byNumber].sort((a, b) => {
                    const ga = groupInfoById[a.id];
                    const gb = groupInfoById[b.id];
                    if (ga && gb) {
                        if (ga.groupIdx !== gb.groupIdx) return ga.groupIdx - gb.groupIdx;
                        return ga.orderInGroup - gb.orderInGroup;
                    }
                    if (ga && !gb) return -1;
                    if (!ga && gb) return 1;
                    return 0;
                });
            }, [data.students, sortMode, groupInfoById]);

            const submitForm = (e) => {
                e.preventDefault();
                if (!form.name.trim()) return;
                updateData(prev => ({ ...prev, students: [...prev.students, { id: uid(), ...form }] }));
                setForm(emptyForm);
            };

            const updateStudentField = (id, field, value) => {
                updateData(prev => ({ ...prev, students: prev.students.map(s => s.id === id ? { ...s, [field]: value } : s) }));
            };
            const deleteStudent = (id) => {
                if (!window.confirm('이 학생을 명단에서 삭제할까요? (기존 기록은 남아있습니다)')) return;
                updateData(prev => ({ ...prev, students: prev.students.filter(s => s.id !== id) }));
            };

            const applyPaste = () => {
                const parsed = pasteText.split('\n').map(l => l.trim()).filter(Boolean).map((line, idx) => {
                    const parts = line.split(/[\t,]+/).map(s => s.trim());
                    if (parts.length >= 2 && /^\d+$/.test(parts[0])) {
                        return { id: uid(), number: parts[0], name: parts[1], gender: parts[2] || '', memo: parts[3] || '' };
                    }
                    return { id: uid(), number: String(idx + 1), name: parts[0], gender: parts[1] || '', memo: parts[2] || '' };
                }).filter(s => s.name);
                if (!parsed.length) return;
                updateData(prev => ({ ...prev, students: [...prev.students, ...parsed] }));
                setPasteText('');
                setShowPaste(false);
            };

            const doImport = async () => {
                if (!google.token) { google.signIn(); return; }
                setBusy(true); setMsg('');
                try {
                    const imported = await importRosterFromSheet(google.token, sheetInput, sheetRange);
                    if (!imported.length) { setMsg('가져올 학생 정보를 찾지 못했습니다.'); return; }
                    updateData(prev => ({ ...prev, students: [...prev.students, ...imported] }));
                    setMsg(`${imported.length}명을 명단에 추가했습니다.`);
                } catch (e) {
                    setMsg(e.message);
                } finally { setBusy(false); }
            };

            if (manageGroups) {
                return (
                    <div>
                        <button onClick={() => setManageGroups(false)} className="text-xs font-bold text-indigo-600 mb-4">← 명단관리로 돌아가기</button>
                        <AssignTab data={data} updateData={updateData} />
                    </div>
                );
            }

            return (
                <div>
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-4">
                        <div className="flex items-center gap-2 flex-wrap">
                            <h3 className="text-lg font-bold text-slate-900">학생 명단 ({students.length}명)</h3>
                            <div className="flex bg-slate-100 rounded-lg p-1 text-xs font-medium">
                                <button onClick={() => setSortMode('number')} className={`px-3 py-1.5 rounded-md ${sortMode === 'number' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600'}`}>번호순</button>
                                <button onClick={() => setSortMode('group')} className={`px-3 py-1.5 rounded-md ${sortMode === 'group' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600'}`}>모둠순</button>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5 sm:gap-2">
                            <button onClick={() => setManageGroups(true)} className="text-xs bg-indigo-50 text-indigo-700 px-2.5 sm:px-3 py-1.5 rounded font-bold border border-indigo-100 hover:bg-indigo-100 whitespace-nowrap">🎲 모둠 관리</button>
                            <button onClick={() => setShowPaste(!showPaste)} className="text-xs bg-indigo-50 text-indigo-700 px-2.5 sm:px-3 py-1.5 rounded font-bold border border-indigo-100 hover:bg-indigo-100 whitespace-nowrap">
                                {showPaste ? '닫기' : '📋 붙여넣기'}
                            </button>
                            <button onClick={() => setShowAddForm(!showAddForm)} className="text-xs bg-slate-100 text-slate-600 px-2.5 sm:px-3 py-1.5 rounded font-bold hover:bg-slate-200 whitespace-nowrap">
                                {showAddForm ? '닫기' : '＋ 자세히 추가'}
                            </button>
                        </div>
                    </div>

                    <form onSubmit={quickAdd} className="flex gap-2 mb-4">
                        <input value={quickName} onChange={e => setQuickName(e.target.value)} placeholder="이름 입력 후 Enter로 바로 추가 (번호 없이, 동아리 명단 등에 편리해요)"
                            className="flex-1 border rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" />
                        <button type="submit" className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-700 shrink-0">＋ 추가</button>
                    </form>

                    {showPaste && (
                        <div className="mb-6 p-4 bg-slate-50 border border-slate-200 rounded-xl">
                            <p className="text-xs text-slate-500 mb-2">한 줄에 한 명씩 입력하세요. 예: <code className="bg-white px-1 rounded">1, 둘리</code> 또는 이름만 입력해도 됩니다.</p>
                            <textarea value={pasteText} onChange={e => setPasteText(e.target.value)} rows="6"
                                className="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500"
                                placeholder={"1, 둘리\n2, 또치\n3, 희동이"} />
                            <div className="flex justify-end mt-2">
                                <button onClick={applyPaste} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700">명단에 추가</button>
                            </div>
                        </div>
                    )}

                    {showAddForm && (
                        <form onSubmit={submitForm} className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-2 mb-6 p-4 bg-white border border-slate-200 rounded-xl shadow-sm">
                            <input placeholder="번호/학번" value={form.number} onChange={e => setForm({ ...form, number: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" />
                            <input placeholder="이름*" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" required />
                            <GenderCycle value={form.gender} onChange={g => setForm({ ...form, gender: g })} />
                            <input placeholder="성적(선택)" value={form.score} onChange={e => setForm({ ...form, score: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" />
                            <input placeholder="메모" value={form.memo} onChange={e => setForm({ ...form, memo: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" />
                            <button type="submit" className="bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700">추가</button>
                        </form>
                    )}

                    <div className="overflow-x-auto border border-slate-200 rounded-xl mb-8">
                        <table className="min-w-full text-sm">
                            <thead className="bg-slate-50 text-slate-500 text-xs">
                                <tr><th className="px-3 py-2 text-left">번호</th><th className="px-3 py-2 text-left">이름</th>{sortMode === 'group' && <th className="px-3 py-2 text-left">모둠</th>}<th className="px-3 py-2 text-left">성별</th><th className="px-3 py-2 text-left">성적</th><th className="px-3 py-2 text-left">메모</th><th className="px-3 py-2"></th></tr>
                            </thead>
                            <tbody>
                                {students.map(s => (
                                    <tr key={s.id} className="border-t border-slate-100 hover:bg-slate-50">
                                        <td className="px-3 py-2 whitespace-nowrap">
                                            <InlineEditText value={s.number} placeholder="번호" onChange={v => updateStudentField(s.id, 'number', v)} />
                                        </td>
                                        <td className="px-3 py-2 font-semibold whitespace-nowrap">
                                            <InlineEditText value={s.name} placeholder="이름" onChange={v => updateStudentField(s.id, 'name', v)} />
                                        </td>
                                        {sortMode === 'group' && (
                                            <td className="px-3 py-2 whitespace-nowrap">
                                                {groupInfoById[s.id] ? (() => {
                                                    const pal = paletteFor(groupInfoById[s.id].groupIdx);
                                                    return (
                                                        <span className={`inline-flex items-center gap-1 text-xs font-bold px-2 py-0.5 rounded-full border ${pal.bg} ${pal.border} ${pal.text}`}>
                                                            <span className={`w-1.5 h-1.5 rounded-full ${pal.dot}`}></span>{groupInfoById[s.id].groupName}
                                                        </span>
                                                    );
                                                })() : <span className="text-xs text-slate-300">미배정</span>}
                                            </td>
                                        )}
                                        <td className="px-3 py-2 whitespace-nowrap">
                                            <GenderCycle fullWidth={false} value={s.gender} onChange={g => updateStudentField(s.id, 'gender', g)} />
                                        </td>
                                        <td className="px-3 py-2 text-slate-500 whitespace-nowrap">
                                            <InlineEditText value={s.score} placeholder="성적" onChange={v => updateStudentField(s.id, 'score', v)} />
                                        </td>
                                        <td className="px-3 py-2 text-slate-500 max-w-[16rem]">
                                            <InlineEditText value={s.memo} placeholder="메모" title={s.memo} className="truncate max-w-[15rem]" onChange={v => updateStudentField(s.id, 'memo', v)} />
                                        </td>
                                        <td className="px-3 py-2 text-right whitespace-nowrap">
                                            <button onClick={() => deleteStudent(s.id)} className="text-[10px] px-2 py-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100 font-medium">삭제</button>
                                        </td>
                                    </tr>
                                ))}
                                {students.length === 0 && <tr><td colSpan={sortMode === 'group' ? 7 : 6} className="px-3 py-8 text-center text-slate-400">등록된 학생이 없습니다.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div className="p-4 bg-white border border-slate-200 rounded-xl mb-6">
                        <h4 className="font-bold text-sm mb-2">📁 엑셀(.xlsx) 파일로 명단·모둠 가져오기</h4>
                        <p className="text-xs text-slate-500 mb-3">'모둠, 학번, 이름' 등의 열이 있는 시트를 그대로 업로드하면 명단과 기존 모둠 배정을 함께 불러옵니다. 시트가 여러 개(예: 반별 시트)면 하나씩 골라 가져올 수 있습니다.</p>
                        <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={(e) => {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                try {
                                    const wb = window.XLSX.read(ev.target.result, { type: 'array' });
                                    const sheets = {};
                                    wb.SheetNames.forEach(name => { sheets[name] = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null }); });
                                    setWorkbook({ fileName: file.name, sheets });
                                    setSelectedSheet(wb.SheetNames[0]);
                                    setXlsxMsg('');
                                } catch (err) { setXlsxMsg('엑셀 파일을 읽지 못했습니다: ' + err.message); }
                            };
                            reader.readAsArrayBuffer(file);
                        }} className="text-xs mb-3" />

                        {workbook && (
                            <div>
                                <div className="flex flex-wrap gap-1.5 mb-3">
                                    {Object.keys(workbook.sheets).map(name => (
                                        <button key={name} onClick={() => setSelectedSheet(name)}
                                            className={`text-xs px-2.5 py-1.5 rounded-lg border font-bold ${selectedSheet === name ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-200 hover:border-indigo-300'}`}>
                                            {name}
                                        </button>
                                    ))}
                                </div>
                                {selectedSheet && (() => {
                                    const parsed = parseImportedSheet(workbook.sheets[selectedSheet]);
                                    return (
                                        <div>
                                            <p className="text-xs text-slate-600 mb-2">'{selectedSheet}' 시트: 학생 {parsed.students.length}명, 모둠 {parsed.groups.length}개 인식됨</p>
                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={() => {
                                                    updateData(prev => {
                                                        const existingByNumber = new Map(prev.students.filter(s => s.number).map(s => [s.number, s]));
                                                        const newStudents = parsed.students.filter(s => !s.number || !existingByNumber.has(s.number));
                                                        const next = { ...prev, students: [...prev.students, ...newStudents] };
                                                        if (parsed.groups.length) {
                                                            const resolveId = (parsedId) => {
                                                                const ps = parsed.students.find(s => s.id === parsedId);
                                                                if (!ps) return parsedId;
                                                                if (ps.number && existingByNumber.has(ps.number)) return existingByNumber.get(ps.number).id;
                                                                return ps.id;
                                                            };
                                                            const groups = parsed.groups.map(g => ({ ...g, memberIds: g.memberIds.map(resolveId) }));
                                                            next.rounds = [{ id: uid(), name: parsed.roundName || `${selectedSheet} 가져온 모둠`, date: todayStr(), groups, createdAt: Date.now() }, ...prev.rounds];
                                                        }
                                                        return next;
                                                    });
                                                    setXlsxMsg(`'${selectedSheet}' 시트를 현재 학급으로 가져왔습니다.`);
                                                }} className="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-emerald-700">
                                                    현재 학급으로 가져오기
                                                </button>
                                                {Object.keys(workbook.sheets).length > 1 && (
                                                    <button onClick={importAllSheetsAsClasses} disabled={bulkBusy} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                                                        {bulkBusy ? '만드는 중...' : `📚 시트 ${Object.keys(workbook.sheets).length}개 전부 학급으로 한 번에 만들기`}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })()}
                                {xlsxMsg && <p className="text-xs text-emerald-600 mt-2 font-medium">{xlsxMsg}</p>}
                            </div>
                        )}
                    </div>

                    <div className="p-4 bg-white border border-slate-200 rounded-xl mb-6">
                        <h4 className="font-bold text-sm mb-2">🏫 여러 학급 한 번에 만들기</h4>
                        <p className="text-xs text-slate-500 mb-2">"학급, 번호, 이름" 형식으로 전체 학급의 명단을 한 번에 붙여넣으면 학급이 자동으로 만들어지고 각 학급에 명단이 채워집니다. 번호는 생략해도 됩니다.</p>
                        <textarea value={bulkPasteText} onChange={e => setBulkPasteText(e.target.value)} rows="8"
                            className="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500 font-mono"
                            placeholder={"3-1, 1, 둘리\n3-1, 2, 또치\n3-2, 1, 희동이\n3-2, 2, 길동이"} />
                        <div className="flex items-center gap-2 mt-2">
                            <button onClick={applyMultiClassPaste} disabled={bulkBusy} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                                {bulkBusy ? '만드는 중...' : '학급 자동 생성 + 명단 등록'}
                            </button>
                        </div>
                        {bulkMsg && <p className="text-xs text-emerald-600 mt-2 font-medium">{bulkMsg}</p>}
                    </div>

                    <div className="p-4 bg-white border border-slate-200 rounded-xl">
                        <h4 className="font-bold text-sm mb-2">📄 구글 스프레드시트에서 명단 가져오기</h4>
                        {!google.clientId ? (
                            <p className="text-xs text-slate-500">설정 탭에서 Google 클라이언트 ID를 먼저 등록하세요.</p>
                        ) : (
                            <div className="space-y-2">
                                <input value={sheetInput} onChange={e => setSheetInput(e.target.value)} placeholder="스프레드시트 URL 또는 ID" className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" />
                                <input value={sheetRange} onChange={e => setSheetRange(e.target.value)} placeholder="시트 범위 (예: 시트1!A1:D100)" className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" />
                                <div className="flex items-center gap-2">
                                    <button onClick={doImport} disabled={busy} className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-700 disabled:opacity-50">
                                        {google.token ? (busy ? '가져오는 중...' : '가져오기') : 'Google 계정 연결 후 가져오기'}
                                    </button>
                                    {msg && <span className="text-xs text-slate-500">{msg}</span>}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------------
        // Group assignment tab
        // ---------------------------------------------------------------
        function AssignTab({ data, updateData }) {
            const students = useMemo(() => [...data.students].sort(byNumberThenName), [data.students]);
            const [mode, setMode] = useState('groupCount');
            const [count, setCount] = useState(4);
            const [size, setSize] = useState(4);
            const [roundName, setRoundName] = useState('');
            const [draft, setDraft] = useState(null); // { groups, unassigned }
            const [editingRoundId, setEditingRoundId] = useState(null);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [dragOverGroupId, setDragOverGroupId] = useState(null);
            const [expandedRoundId, setExpandedRoundId] = useState(null);
            const [autoMode, setAutoMode] = useState('random');

            const groupCount = mode === 'groupCount' ? Math.max(1, Number(count) || 1) : Math.max(1, Math.ceil(students.length / Math.max(1, Number(size) || 1)));

            const startDraft = () => {
                const groups = Array.from({ length: groupCount }, (_, i) => ({ id: uid(), name: `${i + 1}모둠`, memberIds: [], leaderId: null }));
                setDraft({ groups, unassigned: students.map(s => s.id) });
                setEditingRoundId(null);
                setRoundName(`${new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' })} 모둠`);
                setSelectedStudent(null);
            };

            const editRound = (round) => {
                const assignedIds = new Set(round.groups.flatMap(g => g.memberIds));
                setDraft({ groups: round.groups.map(g => ({ ...g, memberIds: [...g.memberIds] })), unassigned: students.filter(s => !assignedIds.has(s.id)).map(s => s.id) });
                setEditingRoundId(round.id);
                setRoundName(round.name);
                setSelectedStudent(null);
                setExpandedRoundId(null);
            };

            const runAutoAssign = () => {
                if (!draft || draft.unassigned.length === 0) return;
                setDraft(autoAssignUnassigned(draft, students, autoMode, data.rounds));
            };

            const resetToUnassigned = () => {
                if (!draft) return;
                setDraft({ groups: draft.groups.map(g => ({ ...g, memberIds: [], leaderId: null })), unassigned: students.map(s => s.id) });
            };

            const moveStudentToGroup = (studentId, groupId) => {
                if (!studentId || !draft) return;
                const groups = draft.groups.map(g => ({ ...g, memberIds: g.memberIds.filter(id => id !== studentId), leaderId: g.leaderId === studentId ? null : g.leaderId }));
                const target = groups.find(g => g.id === groupId);
                if (target) target.memberIds.push(studentId);
                const unassigned = draft.unassigned.filter(id => id !== studentId);
                setDraft({ groups, unassigned });
                setSelectedStudent(null);
            };

            const moveStudentToUnassigned = (studentId) => {
                if (!studentId || !draft) return;
                const groups = draft.groups.map(g => ({ ...g, memberIds: g.memberIds.filter(id => id !== studentId), leaderId: g.leaderId === studentId ? null : g.leaderId }));
                setDraft({ groups, unassigned: draft.unassigned.includes(studentId) ? draft.unassigned : [...draft.unassigned, studentId] });
                setSelectedStudent(null);
            };

            const toggleLeader = (groupId, studentId) => {
                if (!draft) return;
                setDraft({ ...draft, groups: draft.groups.map(g => g.id === groupId ? { ...g, leaderId: g.leaderId === studentId ? null : studentId } : g) });
            };

            const handleGroupClick = (groupId) => selectedStudent && moveStudentToGroup(selectedStudent, groupId);
            const allowDrop = (groupId) => (e) => { e.preventDefault(); setDragOverGroupId(groupId); };
            const handleDropOnGroup = (groupId) => (e) => {
                e.preventDefault();
                moveStudentToGroup(e.dataTransfer.getData('text/plain'), groupId);
                setDragOverGroupId(null);
            };
            const handleDropOnUnassigned = (e) => {
                e.preventDefault();
                moveStudentToUnassigned(e.dataTransfer.getData('text/plain'));
                setDragOverGroupId(null);
            };

            const addGroup = () => draft && setDraft({ ...draft, groups: [...draft.groups, { id: uid(), name: `${draft.groups.length + 1}모둠`, memberIds: [], leaderId: null }] });
            const removeGroup = (groupId) => {
                if (!draft) return;
                const g = draft.groups.find(g => g.id === groupId);
                setDraft({ groups: draft.groups.filter(gr => gr.id !== groupId), unassigned: [...draft.unassigned, ...g.memberIds] });
            };
            const renameGroup = (groupId, name) => draft && setDraft({ ...draft, groups: draft.groups.map(g => g.id === groupId ? { ...g, name } : g) });

            const saveRound = () => {
                if (!draft || !roundName.trim()) return;
                if (editingRoundId) {
                    updateData(prev => ({ ...prev, rounds: prev.rounds.map(r => r.id === editingRoundId ? { ...r, name: roundName.trim(), groups: draft.groups } : r) }));
                } else {
                    const round = { id: uid(), name: roundName.trim(), date: todayStr(), groups: draft.groups, createdAt: Date.now() };
                    updateData(prev => ({ ...prev, rounds: [round, ...prev.rounds] }));
                }
                setDraft(null);
                setEditingRoundId(null);
            };

            const cancelDraft = () => { setDraft(null); setEditingRoundId(null); };

            const deleteRound = (id) => {
                if (!window.confirm('이 회차의 모둠 배정을 삭제할까요?')) return;
                updateData(prev => ({ ...prev, rounds: prev.rounds.filter(r => r.id !== id) }));
            };

            return (
                <div>
                    <h3 className="text-lg font-bold text-slate-900 mb-4">모둠 배정</h3>

                    {!draft ? (
                        <div className="p-4 bg-white border border-slate-200 rounded-xl mb-8">
                            {students.length === 0 ? (
                                <p className="text-sm text-slate-500">먼저 명단 관리 탭에서 학생을 등록하세요.</p>
                            ) : (
                                <div className="flex flex-wrap items-end gap-3">
                                    <div className="flex bg-slate-100 rounded-lg p-1 text-xs font-medium">
                                        <button onClick={() => setMode('groupCount')} className={`px-3 py-1.5 rounded-md ${mode === 'groupCount' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600'}`}>모둠 수로 배정</button>
                                        <button onClick={() => setMode('groupSize')} className={`px-3 py-1.5 rounded-md ${mode === 'groupSize' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600'}`}>모둠 인원으로 배정</button>
                                    </div>
                                    {mode === 'groupCount' ? (
                                        <label className="text-xs text-slate-600">모둠 수 <input type="number" min="1" value={count} onChange={e => setCount(e.target.value)} className="w-16 border rounded px-2 py-1 ml-1" /></label>
                                    ) : (
                                        <label className="text-xs text-slate-600">모둠당 인원 <input type="number" min="1" value={size} onChange={e => setSize(e.target.value)} className="w-16 border rounded px-2 py-1 ml-1" /></label>
                                    )}
                                    <span className="text-xs text-slate-400">→ 총 {groupCount}개 모둠</span>
                                    <button onClick={startDraft} className="ml-auto bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-700">새 배정 시작하기</button>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="mb-8">
                            <div className="flex flex-wrap items-center gap-2 mb-2 p-4 pb-2 bg-indigo-50 border border-indigo-100 rounded-t-xl">
                                {editingRoundId && <span className="text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded-full border border-amber-200">회차 수정 중</span>}
                                <input value={roundName} onChange={e => setRoundName(e.target.value)} className="border rounded-lg px-3 py-2 text-sm flex-1 min-w-[160px]" placeholder="회차 이름" />
                                <button onClick={addGroup} className="bg-white border border-slate-200 text-slate-600 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-100">＋ 모둠 추가</button>
                                <button onClick={saveRound} className="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-emerald-700">저장하기</button>
                                <button onClick={cancelDraft} className="bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-300">취소</button>
                            </div>
                            <div className="flex flex-wrap items-center gap-2 mb-4 p-4 pt-2 bg-indigo-50 border border-t-0 border-indigo-100 rounded-b-xl">
                                <select value={autoMode} onChange={e => setAutoMode(e.target.value)} className="border rounded-lg px-2 py-2 text-xs bg-white">
                                    {ASSIGN_MODES.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                                </select>
                                <button onClick={runAutoAssign} className="bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-indigo-700">🎲 조건에 맞게 자동 배정</button>
                                <button onClick={resetToUnassigned} className="bg-white border border-slate-200 text-slate-500 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-100">↺ 전체 미배정으로</button>
                            </div>
                            <p className="text-xs text-slate-500 mb-3">
                                조장·분리해야 할 학생 등은 먼저 학생을 클릭(또는 드래그)해 원하는 모둠에 직접 넣어두고, 나머지는 "자동 배정"으로 채우세요 — 이미 넣어둔 학생은 그대로 남고 미배정 학생만 채워집니다.
                                "성적 골고루"·"성별 균형"은 명단관리에서 입력한 성적/성별을 기준으로 하고, "최대한 섞기"는 이전에 저장된 회차들과 되도록 겹치지 않게 배정합니다. 학생 칩 옆 👑를 누르면 그 모둠의 조장으로 지정됩니다.
                            </p>

                            <div onDragOver={(e) => e.preventDefault()} onDrop={handleDropOnUnassigned}
                                className={`mb-4 p-3 border-2 border-dashed rounded-xl ${draft.unassigned.length ? 'bg-slate-50 border-slate-300' : 'bg-slate-50/50 border-slate-200'}`}>
                                <p className="text-xs font-bold text-slate-500 mb-2">미배정 ({draft.unassigned.length}명) · 여기로 드래그하면 배정이 해제돼요</p>
                                <div className="flex flex-wrap gap-2">
                                    {draft.unassigned.map(id => {
                                        const s = students.find(st => st.id === id);
                                        return <MemberChip key={id} student={s} draggable
                                            onDragStart={(e) => e.dataTransfer.setData('text/plain', id)}
                                            selected={selectedStudent === id}
                                            onClick={() => setSelectedStudent(selectedStudent === id ? null : id)} />;
                                    })}
                                    {draft.unassigned.length === 0 && <span className="text-xs text-slate-300">모든 학생이 배정되었습니다</span>}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                {draft.groups.map((g, idx) => (
                                    <GroupCluster key={g.id} group={g} idx={idx} students={students} interactive
                                        dropReady={dragOverGroupId === g.id} onToggleLeader={toggleLeader}
                                        onDragOverAllow={allowDrop(g.id)} onDropStudent={handleDropOnGroup(g.id)}>
                                        <div onClick={() => handleGroupClick(g.id)} className={selectedStudent ? 'cursor-pointer' : ''}>
                                            <div className="flex justify-between items-center">
                                                <input value={g.name} onClick={e => e.stopPropagation()} onChange={e => renameGroup(g.id, e.target.value)}
                                                    className="font-bold text-sm border-b border-transparent hover:border-slate-300 focus:border-indigo-500 outline-none bg-transparent w-24" />
                                                <button onClick={(e) => { e.stopPropagation(); removeGroup(g.id); }} className="text-[10px] text-rose-500 hover:underline">모둠 삭제</button>
                                            </div>
                                        </div>
                                    </GroupCluster>
                                ))}
                            </div>
                        </div>
                    )}

                    <h4 className="font-bold text-sm text-slate-700 mb-3">저장된 모둠 배정 회차</h4>
                    <div className="space-y-3">
                        {data.rounds.map(r => (
                            <div key={r.id} className="border border-slate-200 rounded-xl bg-white">
                                <div className="flex justify-between items-center p-3 cursor-pointer" onClick={() => setExpandedRoundId(expandedRoundId === r.id ? null : r.id)}>
                                    <div>
                                        <span className="font-bold text-sm">{r.name}</span>
                                        <span className="text-xs text-slate-400 ml-2">{r.date} · 모둠 {r.groups.length}개</span>
                                    </div>
                                    <div className="flex gap-1">
                                        <button onClick={(e) => { e.stopPropagation(); editRound(r); }} className="text-[10px] px-2 py-1 bg-indigo-50 text-indigo-700 rounded hover:bg-indigo-100 font-medium">수정</button>
                                        <button onClick={(e) => { e.stopPropagation(); deleteRound(r.id); }} className="text-[10px] px-2 py-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100 font-medium">삭제</button>
                                    </div>
                                </div>
                                {expandedRoundId === r.id && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 p-3 pt-0">
                                        {r.groups.map((g, idx) => (
                                            <GroupCluster key={g.id} group={g} idx={idx} students={students} interactive={false}>
                                                <p className="font-bold text-sm">{g.name}</p>
                                            </GroupCluster>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ))}
                        {data.rounds.length === 0 && <p className="text-sm text-slate-400">아직 저장된 모둠 배정이 없습니다.</p>}
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------------
        // Classroom tab — free-form seating chart. Students from the most
        // recent round's groups are shown as individually draggable name
        // tokens (color-coded per group) on a classroom-shaped canvas, so
        // the teacher can mold whatever real desk shape (square, triangle,
        // circle, arch, ...) their room actually has, by hand — instead of
        // picking from preset cluster shapes.
        // ---------------------------------------------------------------
        function ClassroomTab({ data, updateData, onGroupClick }) {
            const round = data.rounds && data.rounds[0];
            const canvasRef = useRef(null);
            const dragRef = useRef(null);
            const groupDragRef = useRef(null);
            const [positions, setPositions] = useState({});
            const [draggingId, setDraggingId] = useState(null);
            const [draggingGroupIdx, setDraggingGroupIdx] = useState(null);
            const [canvasSize, setCanvasSize] = useState({ width: 1000, height: 560 });

            const savedLayout = (round && data.classroomLayout && data.classroomLayout[round.id]) || {};

            useEffect(() => {
                setPositions(savedLayout);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [round ? round.id : null]);

            useEffect(() => {
                const el = canvasRef.current;
                if (!el) return;
                const update = () => setCanvasSize({ width: el.clientWidth, height: el.clientHeight });
                update();
                const ro = new ResizeObserver(update);
                ro.observe(el);
                return () => ro.disconnect();
            }, [round ? round.id : null]);

            if (!round) {
                return (
                    <div className="text-center py-16">
                        <p className="text-4xl mb-3">🏫</p>
                        <p className="text-sm text-slate-400">아직 저장된 모둠이 없어요.<br />명단관리의 "🎲 모둠 관리"에서 먼저 모둠을 만들어보세요.</p>
                    </div>
                );
            }

            const groups = round.groups;
            const clampPct = (v, min, max) => Math.min(max, Math.max(min, v));

            // The board sits at the BOTTOM of this canvas (teacher's own point of
            // view, standing at the front facing the class) — so group slots and
            // token defaults are laid out top-heavy, clearing a small top strip
            // (교실 뒤 label) and a taller bottom strip (the board).
            const groupSlotCenter = (idx) => {
                const cols = groups.length <= 1 ? 1 : Math.min(4, Math.ceil(Math.sqrt(groups.length)));
                const rows = Math.ceil(groups.length / cols);
                const col = idx % cols;
                const row = Math.floor(idx / cols);
                const x = cols > 1 ? 18 + col * (64 / (cols - 1)) : 50;
                const y = rows > 1 ? 68 - row * (48 / (rows - 1)) : 44;
                return { x, y };
            };

            const defaultStudentPos = (groupIdx, idxInGroup, groupSize) => {
                const center = groupSlotCenter(groupIdx);
                const miniCols = Math.min(3, Math.ceil(Math.sqrt(groupSize)));
                const miniRows = Math.ceil(groupSize / miniCols);
                const col = idxInGroup % miniCols;
                const row = Math.floor(idxInGroup / miniCols);
                // fixed pixel spacing between same-group tokens (converted to % so
                // it stays legible — not overlapping — on narrow mobile canvases too)
                const dxPct = (46 / canvasSize.width) * 100;
                const dyPct = (42 / canvasSize.height) * 100;
                const dx = (col - (miniCols - 1) / 2) * dxPct;
                const dy = (row - (miniRows - 1) / 2) * dyPct;
                return { x: clampPct(center.x + dx, 6, 94), y: clampPct(center.y + dy, 8, 88) };
            };

            const getPos = (studentId, fallback) => positions[studentId] || savedLayout[studentId] || fallback;

            // flatten groups → individual draggable tokens, and keep a per-student
            // position lookup + per-group member position list (needed for the
            // "grab the whole cluster" handle below)
            const tokens = [];
            const posById = {};
            const groupMemberPos = groups.map(() => []);
            groups.forEach((g, gi) => {
                g.memberIds.forEach((id, mi) => {
                    const student = data.students.find(s => s.id === id);
                    if (!student) return;
                    const pos = getPos(id, defaultStudentPos(gi, mi, g.memberIds.length));
                    posById[id] = pos;
                    groupMemberPos[gi].push(pos);
                    tokens.push({ student, groupIdx: gi, pos });
                });
            });

            const groupHandles = groups.map((g, gi) => {
                const memberPos = groupMemberPos[gi];
                if (!memberPos.length) return null;
                const cx = memberPos.reduce((s, p) => s + p.x, 0) / memberPos.length;
                const minY = Math.min(...memberPos.map(p => p.y));
                return { x: clampPct(cx, 4, 96), y: Math.max(4, minY - 7) };
            });

            const onGroupPointerDown = (e, groupIdx) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const canvasRect = canvas.getBoundingClientRect();
                const memberStart = {};
                groups[groupIdx].memberIds.forEach(id => {
                    if (posById[id]) memberStart[id] = posById[id];
                });
                groupDragRef.current = {
                    groupIdx,
                    canvasRect,
                    startClientX: e.clientX,
                    startClientY: e.clientY,
                    memberStart,
                    lastDelta: { x: 0, y: 0 },
                    moved: false,
                };
                setDraggingGroupIdx(groupIdx);
                e.currentTarget.setPointerCapture(e.pointerId);
            };

            const onGroupPointerMove = (e) => {
                const d = groupDragRef.current;
                if (!d) return;
                const dxPct = ((e.clientX - d.startClientX) / d.canvasRect.width) * 100;
                const dyPct = ((e.clientY - d.startClientY) / d.canvasRect.height) * 100;
                if (Math.abs(e.clientX - d.startClientX) > 4 || Math.abs(e.clientY - d.startClientY) > 4) d.moved = true;
                d.lastDelta = { x: dxPct, y: dyPct };
                setPositions(prev => {
                    const next = { ...prev };
                    Object.entries(d.memberStart).forEach(([id, start]) => {
                        next[id] = { x: clampPct(start.x + dxPct, 3, 97), y: clampPct(start.y + dyPct, 16, 96) };
                    });
                    return next;
                });
            };

            const onGroupPointerUp = () => {
                const d = groupDragRef.current;
                if (!d) return;
                groupDragRef.current = null;
                setDraggingGroupIdx(null);
                if (!d.moved) {
                    // A tap, not a drag — jump to that group's activity record
                    // instead of writing a no-op position update.
                    if (onGroupClick) onGroupClick(groups[d.groupIdx].id);
                    return;
                }
                const updates = {};
                Object.entries(d.memberStart).forEach(([id, start]) => {
                    updates[id] = { x: clampPct(start.x + d.lastDelta.x, 3, 97), y: clampPct(start.y + d.lastDelta.y, 16, 96) };
                });
                updateData(dprev => ({
                    ...dprev,
                    classroomLayout: {
                        ...(dprev.classroomLayout || {}),
                        [round.id]: { ...((dprev.classroomLayout || {})[round.id]), ...updates },
                    },
                }));
            };

            const onPointerDown = (e, studentId) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const canvasRect = canvas.getBoundingClientRect();
                const box = e.currentTarget.getBoundingClientRect();
                dragRef.current = {
                    studentId,
                    canvasRect,
                    offsetX: e.clientX - box.left,
                    offsetY: e.clientY - box.top,
                    boxW: box.width,
                    boxH: box.height,
                };
                setDraggingId(studentId);
                e.currentTarget.setPointerCapture(e.pointerId);
            };

            const onPointerMove = (e) => {
                const d = dragRef.current;
                if (!d) return;
                const { canvasRect, offsetX, offsetY, boxW, boxH } = d;
                const leftPx = e.clientX - canvasRect.left - offsetX + boxW / 2;
                const topPx = e.clientY - canvasRect.top - offsetY + boxH / 2;
                let xPct = (leftPx / canvasRect.width) * 100;
                let yPct = (topPx / canvasRect.height) * 100;
                xPct = clampPct(xPct, 3, 97);
                yPct = clampPct(yPct, 4, 90);
                d.lastPos = { x: xPct, y: yPct };
                setPositions(prev => ({ ...prev, [d.studentId]: d.lastPos }));
            };

            const onPointerUp = () => {
                const d = dragRef.current;
                if (!d) return;
                dragRef.current = null;
                setDraggingId(null);
                if (d.lastPos) {
                    updateData(dprev => ({
                        ...dprev,
                        classroomLayout: {
                            ...(dprev.classroomLayout || {}),
                            [round.id]: { ...((dprev.classroomLayout || {})[round.id]), [d.studentId]: d.lastPos },
                        },
                    }));
                }
            };

            const resetLayout = () => {
                if (!window.confirm('배치를 기본 위치로 되돌릴까요?')) return;
                setPositions({});
                updateData(prev => {
                    const next = { ...(prev.classroomLayout || {}) };
                    delete next[round.id];
                    return { ...prev, classroomLayout: next };
                });
            };

            return (
                <div>
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                        <div>
                            <h3 className="text-lg font-bold text-slate-900">교실</h3>
                            <p className="text-xs text-slate-400">{round.name} 기준 · 🧩 손잡이를 탭하면 그 모둠 기록으로 이동하고, 끌면 모둠 전체가 함께 움직여요. 이름표 하나씩 끌면 그 학생만 움직여요.</p>
                        </div>
                        <button onClick={resetLayout} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 font-bold shrink-0">↺ 기본 배치로</button>
                    </div>

                    <div ref={canvasRef}
                        className="relative w-full h-[54vh] max-h-[420px] sm:h-[65vh] sm:max-h-[560px] rounded-2xl border-2 border-amber-100 overflow-hidden select-none"
                        style={{ background: 'linear-gradient(180deg, #fbead3 0%, #fbead3 90%, #fdf6ec 90%, #fdf6ec 100%)' }}>

                        {/* floor tile texture */}
                        <div className="absolute inset-0" style={{
                            top: '6%',
                            bottom: '10%',
                            backgroundImage: 'linear-gradient(#f3ddb8 1px, transparent 1px), linear-gradient(90deg, #f3ddb8 1px, transparent 1px)',
                            backgroundSize: '40px 40px',
                            opacity: 0.5,
                        }}></div>

                        {/* 칠판 — bottom of the canvas: this is the teacher's own point of
                            view standing at the front facing the class, so the board sits
                            near the teacher, not the far wall. Kept slim so the whole
                            canvas comfortably fits a phone screen without scrolling. */}
                        <div className="absolute left-1/2 -translate-x-1/2 bottom-1.5 flex flex-col items-center" style={{ width: 'min(55%, 340px)' }}>
                            <div className="w-full rounded-lg shadow-inner px-3 py-1.5 flex items-center justify-center gap-2" style={{ background: '#3d5a45', border: '4px solid #8b5e3c' }}>
                                <span className="text-white/90 text-[11px] sm:text-sm font-bold tracking-wide">🎵 칠판 🎵</span>
                            </div>
                            <div className="w-[65%] h-1 rounded-b-sm" style={{ background: '#c9a876' }}></div>
                        </div>

                        {/* group "grab whole cluster" handles — drag to move every member together */}
                        {groupHandles.map((h, gi) => {
                            if (!h) return null;
                            const pal = paletteFor(gi);
                            const dragging = draggingGroupIdx === gi;
                            return (
                                <div key={groups[gi].id}
                                    onPointerDown={(e) => onGroupPointerDown(e, gi)}
                                    onPointerMove={onGroupPointerMove}
                                    onPointerUp={onGroupPointerUp}
                                    onPointerCancel={onGroupPointerUp}
                                    title={`${groups[gi].name} — 탭하면 기록으로 이동, 끌면 전체 이동`}
                                    className={`absolute -translate-x-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing rounded-full border-2 flex items-center justify-center shadow-sm ${pal.bg} ${pal.border} ${dragging ? 'shadow-lg scale-125 z-40' : 'z-20 opacity-80 hover:opacity-100'}`}
                                    style={{ left: `${h.x}%`, top: `${h.y}%`, width: '26px', height: '26px', touchAction: 'none', transition: dragging ? 'none' : 'box-shadow .15s, transform .15s' }}>
                                    <span className="text-xs leading-none">🧩</span>
                                </div>
                            );
                        })}

                        {/* individually draggable student tokens, color-coded by group */}
                        {tokens.map(({ student, groupIdx, pos }) => {
                            const pal = paletteFor(groupIdx);
                            const dragging = draggingId === student.id;
                            return (
                                <div key={student.id}
                                    onPointerDown={(e) => onPointerDown(e, student.id)}
                                    onPointerMove={onPointerMove}
                                    onPointerUp={onPointerUp}
                                    onPointerCancel={onPointerUp}
                                    className={`absolute -translate-x-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing rounded-full border-2 px-2.5 py-1.5 shadow-sm ${pal.bg} ${pal.border} ${dragging ? 'shadow-lg scale-110 z-30' : 'z-10'}`}
                                    style={{ left: `${pos.x}%`, top: `${pos.y}%`, touchAction: 'none', transition: dragging ? 'none' : 'box-shadow .15s, transform .15s' }}>
                                    <span className={`text-xs font-bold ${pal.text} whitespace-nowrap`}>{student.name}</span>
                                </div>
                            );
                        })}

                        {/* 교실 뒤 — top of the canvas, farthest from the teacher's own position */}
                        <div className="absolute top-1.5 left-0 right-0 flex items-center justify-center gap-2 text-slate-400 text-[11px] font-bold">
                            <span>🚪</span><span>교실 뒤</span><span>🪟</span><span>🧹</span><span>🪟</span>
                        </div>
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------------
        // Record tab — one screen: whole-group logging + tap a student for
        // their individual record, plus a student-first history view.
        // ---------------------------------------------------------------
        function IndivPanel({ student, data, categories, onAddCategory, isLeader, onToggleLeader, onQuickRate, onMarkAbsent, form, setForm, onToggleTag, onAdd, onDelete }) {
            const records = data.individualRecords.filter(r => r.studentId === student.id).sort((a, b) => b.createdAt - a.createdAt);
            const quickRatings = records.filter(r => r.rating && !r.content && (r.tags || []).length === 0);
            const detailed = records.filter(r => !(r.rating && !r.content && (r.tags || []).length === 0));
            return (
                <div className="mt-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <div className="flex items-center justify-between mb-3">
                        <p className="font-bold text-sm">{studentLabel(data.students, student.id)} 개인 기록</p>
                        <div className="flex gap-1.5">
                            <button onClick={onToggleLeader} className={`text-xs px-2.5 py-1 rounded-full border font-bold ${isLeader ? 'bg-amber-100 text-amber-700 border-amber-300' : 'bg-white text-slate-500 border-slate-200'}`}>
                                👑 조장
                            </button>
                            <button onClick={onMarkAbsent} className="text-xs px-2.5 py-1 rounded-full border font-bold bg-white text-slate-500 border-slate-200 hover:bg-slate-100">
                                🚫 결석
                            </button>
                        </div>
                    </div>

                    <p className="text-xs font-bold text-slate-500 mb-1.5">오늘 활동 평가 (탭하면 바로 저장돼요)</p>
                    <RatingButtons value={null} onChange={onQuickRate} />

                    {quickRatings.length > 0 && (
                        <div className="flex flex-wrap gap-1.5 mt-2">
                            {quickRatings.map(r => (
