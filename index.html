<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모둠 배정 &amp; 생기부 기록 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase (compat build) powers cross-device sync. Inert until a user supplies their own project config in 설정. -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ---------------------------------------------------------------
        // Constants & small utilities
        // ---------------------------------------------------------------
        const DEFAULT_DATA = { students: [], rounds: [], groupRecords: [], individualRecords: [] };
        const RECORD_CATEGORIES = ['자율활동', '동아리활동', '진로활동', '봉사활동', '행동특성 및 종합의견', '교과학습발달상황', '기타'];

        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const todayStr = () => new Date().toISOString().slice(0, 10);
        const shuffle = (arr) => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };
        const byNumberThenName = (a, b) => {
            const an = Number(a.number), bn = Number(b.number);
            if (!isNaN(an) && !isNaN(bn) && an !== bn) return an - bn;
            return a.name.localeCompare(b.name, 'ko');
        };
        const downloadFile = (filename, content, mime = 'application/json') => {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        };

        // ---------------------------------------------------------------
        // Google Identity Services + Sheets API (loaded lazily, no build step)
        // ---------------------------------------------------------------
        let gisLoadPromise = null;
        function loadGis() {
            if (gisLoadPromise) return gisLoadPromise;
            gisLoadPromise = new Promise((resolve, reject) => {
                if (window.google && window.google.accounts) return resolve();
                const s = document.createElement('script');
                s.src = 'https://accounts.google.com/gsi/client';
                s.async = true;
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('Google 스크립트 로드 실패'));
                document.head.appendChild(s);
            });
            return gisLoadPromise;
        }

        function useGoogleAuth(clientId) {
            const [token, setToken] = useState(null);
            const [ready, setReady] = useState(false);
            const [error, setError] = useState('');
            const tokenClientRef = useRef(null);

            useEffect(() => {
                setToken(null);
                setReady(false);
                setError('');
                if (!clientId) return;
                let cancelled = false;
                loadGis().then(() => {
                    if (cancelled) return;
                    try {
                        tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
                            client_id: clientId,
                            scope: 'https://www.googleapis.com/auth/spreadsheets',
                            callback: (resp) => {
                                if (resp && resp.access_token) setToken(resp.access_token);
                                else setError('Google 인증에 실패했습니다.');
                            },
                        });
                        setReady(true);
                    } catch (e) {
                        setError('Google 인증 초기화 실패: ' + e.message);
                    }
                }).catch(e => setError(e.message));
                return () => { cancelled = true; };
            }, [clientId]);

            const signIn = () => {
                if (!tokenClientRef.current) return;
                tokenClientRef.current.requestAccessToken({ prompt: token ? '' : 'consent' });
            };
            const signOut = () => setToken(null);

            return { token, ready, error, signIn, signOut };
        }

        function studentLabel(students, id) {
            const s = students.find(s => s.id === id);
            return s ? `${s.number ? s.number + '번 ' : ''}${s.name}` : '(삭제된 학생)';
        }

        // ---------------------------------------------------------------
        // Shared visual bits for "clustered" group cards
        // ---------------------------------------------------------------
        const GROUP_PALETTE = [
            { bg: 'bg-indigo-50', border: 'border-indigo-200', text: 'text-indigo-700', dot: 'bg-indigo-500', ring: 'ring-indigo-300' },
            { bg: 'bg-rose-50', border: 'border-rose-200', text: 'text-rose-700', dot: 'bg-rose-500', ring: 'ring-rose-300' },
            { bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', dot: 'bg-emerald-500', ring: 'ring-emerald-300' },
            { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-700', dot: 'bg-amber-500', ring: 'ring-amber-300' },
            { bg: 'bg-sky-50', border: 'border-sky-200', text: 'text-sky-700', dot: 'bg-sky-500', ring: 'ring-sky-300' },
            { bg: 'bg-violet-50', border: 'border-violet-200', text: 'text-violet-700', dot: 'bg-violet-500', ring: 'ring-violet-300' },
            { bg: 'bg-pink-50', border: 'border-pink-200', text: 'text-pink-700', dot: 'bg-pink-500', ring: 'ring-pink-300' },
            { bg: 'bg-teal-50', border: 'border-teal-200', text: 'text-teal-700', dot: 'bg-teal-500', ring: 'ring-teal-300' },
        ];
        const paletteFor = (idx) => GROUP_PALETTE[idx % GROUP_PALETTE.length];
        const isLeaderNote = (s) => /조장|리더|앵커|멘토/.test(s.note || s.role || '');
        const mbtiChipClass = (mbti) => mbti === 'E' ? 'bg-amber-100 text-amber-700 border-amber-200'
            : mbti === 'I' ? 'bg-sky-100 text-sky-700 border-sky-200'
            : 'bg-slate-100 text-slate-600 border-slate-200';

        function MemberChip({ student, onClick, onDragStart, draggable, selected, showRemove, onRemove }) {
            if (!student) return null;
            return (
                <span
                    draggable={draggable}
                    onDragStart={onDragStart}
                    onClick={onClick}
                    className={`inline-flex items-center gap-1 pl-1 pr-2 py-1 rounded-full border text-xs font-semibold select-none ${mbtiChipClass(student.mbti)} ${draggable || onClick ? 'cursor-pointer' : ''} ${selected ? 'ring-2 ring-offset-1 ring-indigo-500' : ''}`}
                    title={[student.mbti, student.role, student.note].filter(Boolean).join(' · ')}
                >
                    <span className="w-5 h-5 rounded-full bg-white/80 border border-current/20 flex items-center justify-center text-[10px] font-bold">
                        {student.name ? student.name.slice(-2, -1) || student.name.slice(0, 1) : '?'}
                    </span>
                    <span>{student.name}{isLeaderNote(student) && ' 👑'}</span>
                    {showRemove && (
                        <button onClick={(e) => { e.stopPropagation(); onRemove(); }} className="ml-0.5 text-current/60 hover:text-rose-600 font-bold">×</button>
                    )}
                </span>
            );
        }

        function GroupCluster({ group, idx, students, interactive, dropReady, onDropStudent, onDragOverAllow, children }) {
            const pal = paletteFor(idx);
            const members = group.memberIds.map(id => students.find(s => s.id === id)).filter(Boolean);
            const eCount = members.filter(m => m.mbti === 'E').length;
            const iCount = members.filter(m => m.mbti === 'I').length;
            const scores = members.map(m => Number(m.knowledge)).filter(n => !isNaN(n) && n !== 0);
            const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
            return (
                <div
                    onDragOver={interactive ? onDragOverAllow : undefined}
                    onDrop={interactive ? onDropStudent : undefined}
                    className={`relative p-3 rounded-2xl border-2 ${pal.bg} ${pal.border} ${dropReady ? `ring-2 ring-offset-1 ${pal.ring}` : ''} transition-shadow`}
                >
                    {children}
                    <div className="flex flex-wrap gap-1.5 mt-2 min-h-[2.25rem]">
                        {members.map(m => (
                            <MemberChip key={m.id} student={m} draggable={interactive}
                                onDragStart={interactive ? (e) => e.dataTransfer.setData('text/plain', m.id) : undefined} />
                        ))}
                        {members.length === 0 && <span className="text-xs text-slate-400 italic">비어있음</span>}
                    </div>
                    {(eCount + iCount > 0 || avg !== null) && (
                        <p className={`text-[10px] mt-2 font-semibold ${pal.text}`}>
                            {eCount + iCount > 0 && `E ${eCount} · I ${iCount}`}{eCount + iCount > 0 && avg !== null && ' · '}{avg !== null && `평균 ${avg}점`}
                        </p>
                    )}
                </div>
            );
        }

        function parseImportedSheet(rows) {
            if (!rows || !rows.length) return { students: [], groups: [], roundName: '' };
            const norm = (v) => (v === null || v === undefined) ? '' : String(v).trim();
            const hasHeader = rows[0].some(c => norm(c) === '이름');
            let header, dataRows;
            if (hasHeader) {
                header = rows[0].map(norm);
                dataRows = rows.slice(1);
            } else {
                header = rows[0].length >= 9
                    ? ['모둠', '학번', '이름', '학생 특성', '기타경험', '지식점수', 'MBTI', '선호역할', '배정사유']
                    : ['모둠', '학번', '이름', '기타경험', '지식점수', 'MBTI', '선호역할', '배정사유'];
                dataRows = rows;
            }
            const col = (label) => header.findIndex(h => h.includes(label));
            const idxGroup = col('모둠'), idxNumber = col('학번'), idxName = col('이름');
            const idxTrait = col('특성'), idxExp = col('경험'), idxKnowledge = col('지식') !== -1 ? col('지식') : col('점수');
            const idxMbti = col('MBTI'), idxRole = col('역할'), idxReason = col('사유');

            let roundName = '';
            if (hasHeader) {
                const lastKnownIdx = Math.max(idxGroup, idxNumber, idxName, idxTrait, idxExp, idxKnowledge, idxMbti, idxRole, idxReason);
                const extra = header.slice(lastKnownIdx + 1).find(h => h && h.length > 4);
                if (extra) roundName = extra.replace(/\s+/g, ' ').trim();
            }

            const students = [];
            const groupMap = new Map();
            dataRows.forEach(row => {
                const name = idxName !== -1 ? norm(row[idxName]) : '';
                if (!name || name === '이름') return;
                const rawGroup = idxGroup !== -1 ? row[idxGroup] : null;
                const groupName = (rawGroup === null || rawGroup === undefined || rawGroup === '') ? null
                    : (typeof rawGroup === 'number' ? `${rawGroup}조` : norm(rawGroup));
                const number = idxNumber !== -1 ? norm(row[idxNumber]) : '';
                let mbti = '';
                if (idxMbti !== -1 && row[idxMbti]) {
                    const m = norm(row[idxMbti]).match(/^[EI]/i);
                    mbti = m ? m[0].toUpperCase() : '';
                }
                let knowledge = '';
                if (idxKnowledge !== -1 && row[idxKnowledge] !== null && row[idxKnowledge] !== undefined) {
                    const m = norm(row[idxKnowledge]).match(/\d+/);
                    knowledge = m ? m[0] : '';
                }
                let role = '';
                if (idxRole !== -1 && row[idxRole]) role = norm(row[idxRole]).split(':')[0].trim();
                const experience = idxExp !== -1 ? norm(row[idxExp]) : '';
                const trait = idxTrait !== -1 ? norm(row[idxTrait]) : '';
                const reason = idxReason !== -1 ? norm(row[idxReason]) : '';
                const note = [trait, reason].filter(Boolean).join(' / ');

                const student = { id: uid(), number, name, gender: '', mbti, role, knowledge, experience, note, memo: experience };
                students.push(student);
                if (groupName) {
                    if (!groupMap.has(groupName)) groupMap.set(groupName, []);
                    groupMap.get(groupName).push(student.id);
                }
            });
            const groups = [...groupMap.entries()].map(([name, memberIds]) => ({ id: uid(), name, memberIds }));
            return { students, groups, roundName };
        }

        function buildSheetRows(data) {
            const rosterRows = [
                ['번호', '이름', '성별', '메모'],
                ...[...data.students].sort(byNumberThenName).map(s => [s.number || '', s.name, s.gender || '', s.memo || '']),
            ];
            const assignRows = [['회차', '날짜', '모둠명', '구성원']];
            data.rounds.forEach(r => {
                r.groups.forEach(g => {
                    assignRows.push([r.name, r.date, g.name, g.memberIds.map(id => studentLabel(data.students, id)).join(', ')]);
                });
            });
            const roundById = Object.fromEntries(data.rounds.map(r => [r.id, r]));
            const groupRows = [['회차', '모둠명', '날짜', '기록내용']];
            data.groupRecords.forEach(rec => {
                const round = roundById[rec.roundId];
                const group = round && round.groups.find(g => g.id === rec.groupId);
                groupRows.push([round ? round.name : '(삭제된 회차)', group ? group.name : '(삭제된 모둠)', rec.date, rec.content]);
            });
            const indivRows = [['이름', '구분', '날짜', '관련회차', '기록내용']];
            data.individualRecords.forEach(rec => {
                const round = roundById[rec.roundId];
                indivRows.push([studentLabel(data.students, rec.studentId), rec.category, rec.date, round ? round.name : '', rec.content]);
            });
            return { '명단': rosterRows, '모둠배정': assignRows, '모둠기록': groupRows, '개인기록': indivRows };
        }

        async function sheetsFetch(token, url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers || {}) },
            });
            if (!res.ok) {
                const text = await res.text().catch(() => res.statusText);
                throw new Error(`Google Sheets 요청 실패 (${res.status}): ${text}`);
            }
            return res.json();
        }

        async function exportToSheet(token, data, titlePrefix) {
            const created = await sheetsFetch(token, 'https://sheets.googleapis.com/v4/spreadsheets', {
                method: 'POST',
                body: JSON.stringify({
                    properties: { title: `${titlePrefix} ${new Date().toLocaleDateString('ko-KR')}` },
                    sheets: Object.keys(buildSheetRows(DEFAULT_DATA)).map(title => ({ properties: { title } })),
                }),
            });
            const spreadsheetId = created.spreadsheetId;
            const sheetsData = buildSheetRows(data);
            for (const [sheetName, rows] of Object.entries(sheetsData)) {
                const range = encodeURIComponent(`${sheetName}!A1`);
                await sheetsFetch(token, `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?valueInputOption=RAW`, {
                    method: 'PUT',
                    body: JSON.stringify({ range: `${sheetName}!A1`, majorDimension: 'ROWS', values: rows }),
                });
            }
            return { spreadsheetId, url: created.spreadsheetUrl };
        }

        function extractSpreadsheetId(input) {
            const m = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
            return m ? m[1] : input.trim();
        }

        async function importRosterFromSheet(token, sheetIdOrUrl, range) {
            const spreadsheetId = extractSpreadsheetId(sheetIdOrUrl);
            const json = await sheetsFetch(token, `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(range)}`);
            const rows = json.values || [];
            if (!rows.length) return [];
            const looksLikeHeader = /번호|이름|name/i.test((rows[0] || []).join(''));
            const dataRows = looksLikeHeader ? rows.slice(1) : rows;
            return dataRows.filter(r => r.length && r[0]).map((r, idx) => {
                const [c0, c1, c2, c3] = r;
                if (c1 !== undefined && c1 !== '' && /^\d+$/.test(String(c0).trim())) {
                    return { id: uid(), number: String(c0).trim(), name: String(c1).trim(), gender: c2 || '', memo: c3 || '' };
                }
                return { id: uid(), number: String(idx + 1), name: String(c0).trim(), gender: c1 || '', memo: c2 || '' };
            }).filter(s => s.name);
        }

        // ---------------------------------------------------------------
        // Roster tab
        // ---------------------------------------------------------------
        function RosterTab({ data, updateData, google }) {
            const emptyForm = { number: '', name: '', gender: '', mbti: '', role: '', knowledge: '', memo: '' };
            const [form, setForm] = useState(emptyForm);
            const [editingId, setEditingId] = useState(null);
            const [pasteText, setPasteText] = useState('');
            const [showPaste, setShowPaste] = useState(false);
            const [sheetInput, setSheetInput] = useState('');
            const [sheetRange, setSheetRange] = useState('시트1!A1:D100');
            const [busy, setBusy] = useState(false);
            const [msg, setMsg] = useState('');
            const [workbook, setWorkbook] = useState(null); // { fileName, sheets: { name: rows[][] } }
            const [selectedSheet, setSelectedSheet] = useState('');
            const [xlsxMsg, setXlsxMsg] = useState('');
            const fileRef = useRef(null);

            const students = useMemo(() => [...data.students].sort(byNumberThenName), [data.students]);

            const submitForm = (e) => {
                e.preventDefault();
                if (!form.name.trim()) return;
                updateData(prev => {
                    if (editingId) {
                        return { ...prev, students: prev.students.map(s => s.id === editingId ? { ...s, ...form } : s) };
                    }
                    return { ...prev, students: [...prev.students, { id: uid(), ...form }] };
                });
                setForm(emptyForm);
                setEditingId(null);
            };

            const editStudent = (s) => { setForm({ number: s.number, name: s.name, gender: s.gender || '', mbti: s.mbti || '', role: s.role || '', knowledge: s.knowledge || '', memo: s.memo || '' }); setEditingId(s.id); };
            const deleteStudent = (id) => {
                if (!window.confirm('이 학생을 명단에서 삭제할까요? (기존 기록은 남아있습니다)')) return;
                updateData(prev => ({ ...prev, students: prev.students.filter(s => s.id !== id) }));
            };

            const applyPaste = () => {
                const parsed = pasteText.split('\n').map(l => l.trim()).filter(Boolean).map((line, idx) => {
                    const parts = line.split(/[\t,]+/).map(s => s.trim());
                    if (parts.length >= 2 && /^\d+$/.test(parts[0])) {
                        return { id: uid(), number: parts[0], name: parts[1], gender: parts[2] || '', memo: parts[3] || '' };
                    }
                    return { id: uid(), number: String(idx + 1), name: parts[0], gender: parts[1] || '', memo: parts[2] || '' };
                }).filter(s => s.name);
                if (!parsed.length) return;
                updateData(prev => ({ ...prev, students: [...prev.students, ...parsed] }));
                setPasteText('');
                setShowPaste(false);
            };

            const doImport = async () => {
                if (!google.token) { google.signIn(); return; }
                setBusy(true); setMsg('');
                try {
                    const imported = await importRosterFromSheet(google.token, sheetInput, sheetRange);
                    if (!imported.length) { setMsg('가져올 학생 정보를 찾지 못했습니다.'); return; }
                    updateData(prev => ({ ...prev, students: [...prev.students, ...imported] }));
                    setMsg(`${imported.length}명을 명단에 추가했습니다.`);
                } catch (e) {
                    setMsg(e.message);
                } finally { setBusy(false); }
            };

            return (
                <div>
                    <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                        <h3 className="text-lg font-bold text-slate-900">학생 명단 ({students.length}명)</h3>
                        <button onClick={() => setShowPaste(!showPaste)} className="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded font-bold border border-indigo-100 hover:bg-indigo-100">
                            {showPaste ? '닫기' : '📋 여러 명 붙여넣기'}
                        </button>
                    </div>

                    {showPaste && (
                        <div className="mb-6 p-4 bg-slate-50 border border-slate-200 rounded-xl">
                            <p className="text-xs text-slate-500 mb-2">한 줄에 한 명씩 입력하세요. 예: <code className="bg-white px-1 rounded">1, 김민준</code> 또는 이름만 입력해도 됩니다.</p>
                            <textarea value={pasteText} onChange={e => setPasteText(e.target.value)} rows="6"
                                className="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500"
                                placeholder={"1, 김민준\n2, 이서연\n3, 박도윤"} />
                            <div className="flex justify-end mt-2">
                                <button onClick={applyPaste} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700">명단에 추가</button>
                            </div>
                        </div>
                    )}

                    <form onSubmit={submitForm} className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2 mb-6 p-4 bg-white border border-slate-200 rounded-xl shadow-sm">
                        <input placeholder="번호/학번" value={form.number} onChange={e => setForm({ ...form, number: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" />
                        <input placeholder="이름*" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" required />
                        <input placeholder="성별" value={form.gender} onChange={e => setForm({ ...form, gender: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" />
                        <select value={form.mbti} onChange={e => setForm({ ...form, mbti: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500">
                            <option value="">MBTI</option><option value="E">E</option><option value="I">I</option>
                        </select>
                        <input placeholder="선호역할" value={form.role} onChange={e => setForm({ ...form, role: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" />
                        <input placeholder="지식점수" value={form.knowledge} onChange={e => setForm({ ...form, knowledge: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" />
                        <input placeholder="메모" value={form.memo} onChange={e => setForm({ ...form, memo: e.target.value })} className="border rounded-lg px-2 py-2 text-sm outline-none focus:border-indigo-500" />
                        <div className="flex gap-1">
                            <button type="submit" className="flex-1 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700">{editingId ? '수정' : '추가'}</button>
                            {editingId && <button type="button" onClick={() => { setForm(emptyForm); setEditingId(null); }} className="px-3 bg-slate-200 rounded-lg text-xs font-bold">취소</button>}
                        </div>
                    </form>

                    <div className="overflow-x-auto border border-slate-200 rounded-xl mb-8">
                        <table className="min-w-full text-sm">
                            <thead className="bg-slate-50 text-slate-500 text-xs">
                                <tr><th className="px-3 py-2 text-left">번호</th><th className="px-3 py-2 text-left">이름</th><th className="px-3 py-2 text-left">MBTI</th><th className="px-3 py-2 text-left">선호역할</th><th className="px-3 py-2 text-left">지식점수</th><th className="px-3 py-2 text-left">메모</th><th className="px-3 py-2"></th></tr>
                            </thead>
                            <tbody>
                                {students.map(s => (
                                    <tr key={s.id} className="border-t border-slate-100 hover:bg-slate-50">
                                        <td className="px-3 py-2">{s.number}</td>
                                        <td className="px-3 py-2 font-semibold">{s.name}{isLeaderNote(s) && ' 👑'}</td>
                                        <td className="px-3 py-2">{s.mbti && <span className={`text-[10px] px-1.5 py-0.5 rounded border font-bold ${mbtiChipClass(s.mbti)}`}>{s.mbti}</span>}</td>
                                        <td className="px-3 py-2 text-slate-500">{s.role}</td>
                                        <td className="px-3 py-2 text-slate-500">{s.knowledge}</td>
                                        <td className="px-3 py-2 text-slate-500 max-w-[16rem] truncate" title={s.memo}>{s.memo}</td>
                                        <td className="px-3 py-2 text-right whitespace-nowrap">
                                            <button onClick={() => editStudent(s)} className="text-[10px] px-2 py-1 bg-slate-100 rounded hover:bg-slate-200 font-medium mr-1">수정</button>
                                            <button onClick={() => deleteStudent(s.id)} className="text-[10px] px-2 py-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100 font-medium">삭제</button>
                                        </td>
                                    </tr>
                                ))}
                                {students.length === 0 && <tr><td colSpan="7" className="px-3 py-8 text-center text-slate-400">등록된 학생이 없습니다.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div className="p-4 bg-white border border-slate-200 rounded-xl mb-6">
                        <h4 className="font-bold text-sm mb-2">📁 엑셀(.xlsx) 파일로 명단·모둠 가져오기</h4>
                        <p className="text-xs text-slate-500 mb-3">'모둠, 학번, 이름, MBTI, 선호역할, 지식점수, 배정사유' 등의 열이 있는 시트를 그대로 업로드하면 명단과 기존 모둠 배정을 함께 불러옵니다. 시트가 여러 개(예: 반별 시트)면 하나씩 골라 가져올 수 있습니다.</p>
                        <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={(e) => {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                try {
                                    const wb = window.XLSX.read(ev.target.result, { type: 'array' });
                                    const sheets = {};
                                    wb.SheetNames.forEach(name => { sheets[name] = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null }); });
                                    setWorkbook({ fileName: file.name, sheets });
                                    setSelectedSheet(wb.SheetNames[0]);
                                    setXlsxMsg('');
                                } catch (err) { setXlsxMsg('엑셀 파일을 읽지 못했습니다: ' + err.message); }
                            };
                            reader.readAsArrayBuffer(file);
                        }} className="text-xs mb-3" />

                        {workbook && (
                            <div>
                                <div className="flex flex-wrap gap-1.5 mb-3">
                                    {Object.keys(workbook.sheets).map(name => (
                                        <button key={name} onClick={() => setSelectedSheet(name)}
                                            className={`text-xs px-2.5 py-1.5 rounded-lg border font-bold ${selectedSheet === name ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-200 hover:border-indigo-300'}`}>
                                            {name}
                                        </button>
                                    ))}
                                </div>
                                {selectedSheet && (() => {
                                    const parsed = parseImportedSheet(workbook.sheets[selectedSheet]);
                                    return (
                                        <div>
                                            <p className="text-xs text-slate-600 mb-2">'{selectedSheet}' 시트: 학생 {parsed.students.length}명, 모둠 {parsed.groups.length}개 인식됨</p>
                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={() => {
                                                    updateData(prev => {
                                                        const existingByNumber = new Map(prev.students.filter(s => s.number).map(s => [s.number, s]));
                                                        const newStudents = parsed.students.filter(s => !s.number || !existingByNumber.has(s.number));
                                                        const next = { ...prev, students: [...prev.students, ...newStudents] };
                                                        if (parsed.groups.length) {
                                                            const resolveId = (parsedId) => {
                                                                const ps = parsed.students.find(s => s.id === parsedId);
                                                                if (!ps) return parsedId;
                                                                if (ps.number && existingByNumber.has(ps.number)) return existingByNumber.get(ps.number).id;
                                                                return ps.id;
                                                            };
                                                            const groups = parsed.groups.map(g => ({ ...g, memberIds: g.memberIds.map(resolveId) }));
                                                            next.rounds = [{ id: uid(), name: parsed.roundName || `${selectedSheet} 가져온 모둠`, date: todayStr(), groups, createdAt: Date.now() }, ...prev.rounds];
                                                        }
                                                        return next;
                                                    });
                                                    setXlsxMsg(`'${selectedSheet}' 시트를 현재 학급으로 가져왔습니다.`);
                                                }} className="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-emerald-700">
                                                    현재 학급으로 가져오기
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })()}
                                {xlsxMsg && <p className="text-xs text-emerald-600 mt-2 font-medium">{xlsxMsg}</p>}
                            </div>
                        )}
                    </div>

                    <div className="p-4 bg-white border border-slate-200 rounded-xl">
                        <h4 className="font-bold text-sm mb-2">📄 구글 스프레드시트에서 명단 가져오기</h4>
                        {!google.clientId ? (
                            <p className="text-xs text-slate-500">설정 탭에서 Google 클라이언트 ID를 먼저 등록하세요.</p>
                        ) : (
                            <div className="space-y-2">
                                <input value={sheetInput} onChange={e => setSheetInput(e.target.value)} placeholder="스프레드시트 URL 또는 ID" className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" />
                                <input value={sheetRange} onChange={e => setSheetRange(e.target.value)} placeholder="시트 범위 (예: 시트1!A1:D100)" className="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" />
                                <div className="flex items-center gap-2">
                                    <button onClick={doImport} disabled={busy} className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-700 disabled:opacity-50">
                                        {google.token ? (busy ? '가져오는 중...' : '가져오기') : 'Google 계정 연결 후 가져오기'}
                                    </button>
                                    {msg && <span className="text-xs text-slate-500">{msg}</span>}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------------
        // Group assignment tab
        // ---------------------------------------------------------------
        function AssignTab({ data, updateData }) {
            const students = useMemo(() => [...data.students].sort(byNumberThenName), [data.students]);
            const [mode, setMode] = useState('groupCount');
            const [count, setCount] = useState(4);
            const [size, setSize] = useState(4);
            const [roundName, setRoundName] = useState('');
            const [draft, setDraft] = useState(null); // { groups, unassigned }
            const [editingRoundId, setEditingRoundId] = useState(null);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [dragOverGroupId, setDragOverGroupId] = useState(null);
            const [expandedRoundId, setExpandedRoundId] = useState(null);

            const groupCount = mode === 'groupCount' ? Math.max(1, Number(count) || 1) : Math.max(1, Math.ceil(students.length / Math.max(1, Number(size) || 1)));

            const startDraft = () => {
                const groups = Array.from({ length: groupCount }, (_, i) => ({ id: uid(), name: `${i + 1}모둠`, memberIds: [] }));
                setDraft({ groups, unassigned: students.map(s => s.id) });
                setEditingRoundId(null);
                setRoundName(`${new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' })} 모둠`);
                setSelectedStudent(null);
            };

            const editRound = (round) => {
                const assignedIds = new Set(round.groups.flatMap(g => g.memberIds));
                setDraft({ groups: round.groups.map(g => ({ ...g, memberIds: [...g.memberIds] })), unassigned: students.filter(s => !assignedIds.has(s.id)).map(s => s.id) });
                setEditingRoundId(round.id);
                setRoundName(round.name);
                setSelectedStudent(null);
                setExpandedRoundId(null);
            };

            const randomFill = () => {
                if (!draft) return;
                const pool = shuffle(students.map(s => s.id));
                const groups = draft.groups.map(g => ({ ...g, memberIds: [] }));
                pool.forEach((id, idx) => groups[idx % groups.length].memberIds.push(id));
                setDraft({ groups, unassigned: [] });
            };

            const moveStudentToGroup = (studentId, groupId) => {
                if (!studentId || !draft) return;
                const groups = draft.groups.map(g => ({ ...g, memberIds: g.memberIds.filter(id => id !== studentId) }));
                const target = groups.find(g => g.id === groupId);
                if (target) target.memberIds.push(studentId);
                const unassigned = draft.unassigned.filter(id => id !== studentId);
                setDraft({ groups, unassigned });
                setSelectedStudent(null);
            };

            const moveStudentToUnassigned = (studentId) => {
                if (!studentId || !draft) return;
                const groups = draft.groups.map(g => ({ ...g, memberIds: g.memberIds.filter(id => id !== studentId) }));
                setDraft({ groups, unassigned: draft.unassigned.includes(studentId) ? draft.unassigned : [...draft.unassigned, studentId] });
                setSelectedStudent(null);
            };

            const handleGroupClick = (groupId) => selectedStudent && moveStudentToGroup(selectedStudent, groupId);
            const allowDrop = (groupId) => (e) => { e.preventDefault(); setDragOverGroupId(groupId); };
            const handleDropOnGroup = (groupId) => (e) => {
                e.preventDefault();
                moveStudentToGroup(e.dataTransfer.getData('text/plain'), groupId);
                setDragOverGroupId(null);
            };
            const handleDropOnUnassigned = (e) => {
                e.preventDefault();
                moveStudentToUnassigned(e.dataTransfer.getData('text/plain'));
                setDragOverGroupId(null);
            };

            const addGroup = () => draft && setDraft({ ...draft, groups: [...draft.groups, { id: uid(), name: `${draft.groups.length + 1}모둠`, memberIds: [] }] });
            const removeGroup = (groupId) => {
                if (!draft) return;
                const g = draft.groups.find(g => g.id === groupId);
                setDraft({ groups: draft.groups.filter(gr => gr.id !== groupId), unassigned: [...draft.unassigned, ...g.memberIds] });
            };
            const renameGroup = (groupId, name) => draft && setDraft({ ...draft, groups: draft.groups.map(g => g.id === groupId ? { ...g, name } : g) });

            const saveRound = () => {
                if (!draft || !roundName.trim()) return;
                if (editingRoundId) {
                    updateData(prev => ({ ...prev, rounds: prev.rounds.map(r => r.id === editingRoundId ? { ...r, name: roundName.trim(), groups: draft.groups } : r) }));
                } else {
                    const round = { id: uid(), name: roundName.trim(), date: todayStr(), groups: draft.groups, createdAt: Date.now() };
                    updateData(prev => ({ ...prev, rounds: [round, ...prev.rounds] }));
                }
                setDraft(null);
                setEditingRoundId(null);
            };

            const cancelDraft = () => { setDraft(null); setEditingRoundId(null); };

            const deleteRound = (id) => {
                if (!window.confirm('이 회차의 모둠 배정을 삭제할까요?')) return;
                updateData(prev => ({ ...prev, rounds: prev.rounds.filter(r => r.id !== id) }));
            };

            return (
                <div>
                    <h3 className="text-lg font-bold text-slate-900 mb-4">모둠 배정</h3>

                    {!draft ? (
                        <div className="p-4 bg-white border border-slate-200 rounded-xl mb-8">
                            {students.length === 0 ? (
                                <p className="text-sm text-slate-500">먼저 명단 관리 탭에서 학생을 등록하세요.</p>
                            ) : (
                                <div className="flex flex-wrap items-end gap-3">
                                    <div className="flex bg-slate-100 rounded-lg p-1 text-xs font-medium">
                                        <button onClick={() => setMode('groupCount')} className={`px-3 py-1.5 rounded-md ${mode === 'groupCount' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600'}`}>모둠 수로 배정</button>
                                        <button onClick={() => setMode('groupSize')} className={`px-3 py-1.5 rounded-md ${mode === 'groupSize' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600'}`}>모둠 인원으로 배정</button>
                                    </div>
                                    {mode === 'groupCount' ? (
                                        <label className="text-xs text-slate-600">모둠 수 <input type="number" min="1" value={count} onChange={e => setCount(e.target.value)} className="w-16 border rounded px-2 py-1 ml-1" /></label>
                                    ) : (
                                        <label className="text-xs text-slate-600">모둠당 인원 <input type="number" min="1" value={size} onChange={e => setSize(e.target.value)} className="w-16 border rounded px-2 py-1 ml-1" /></label>
                                    )}
                                    <span className="text-xs text-slate-400">→ 총 {groupCount}개 모둠</span>
                                    <button onClick={startDraft} className="ml-auto bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-700">새 배정 시작하기</button>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="mb-8">
                            <div className="flex flex-wrap items-center gap-2 mb-4 p-4 bg-indigo-50 border border-indigo-100 rounded-xl">
                                {editingRoundId && <span className="text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded-full border border-amber-200">회차 수정 중</span>}
                                <input value={roundName} onChange={e => setRoundName(e.target.value)} className="border rounded-lg px-3 py-2 text-sm flex-1 min-w-[160px]" placeholder="회차 이름" />
                                <button onClick={randomFill} className="bg-white border border-indigo-200 text-indigo-700 text-xs font-bold px-3 py-2 rounded-lg hover:bg-indigo-100">🎲 무작위 배정</button>
                                <button onClick={addGroup} className="bg-white border border-slate-200 text-slate-600 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-100">＋ 모둠 추가</button>
                                <button onClick={saveRound} className="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-emerald-700">저장하기</button>
                                <button onClick={cancelDraft} className="bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-300">취소</button>
                            </div>
                            <p className="text-xs text-slate-500 mb-3">학생을 클릭(또는 드래그)해서 이동할 모둠에 놓으면 자유롭게 재배정할 수 있어요. 이미 저장된 회차도 "수정"으로 다시 불러와 바꿀 수 있습니다.</p>

                            <div onDragOver={(e) => e.preventDefault()} onDrop={handleDropOnUnassigned}
                                className={`mb-4 p-3 border-2 border-dashed rounded-xl ${draft.unassigned.length ? 'bg-slate-50 border-slate-300' : 'bg-slate-50/50 border-slate-200'}`}>
                                <p className="text-xs font-bold text-slate-500 mb-2">미배정 ({draft.unassigned.length}명) · 여기로 드래그하면 배정이 해제돼요</p>
                                <div className="flex flex-wrap gap-2">
                                    {draft.unassigned.map(id => {
                                        const s = students.find(st => st.id === id);
                                        return <MemberChip key={id} student={s} draggable
                                            onDragStart={(e) => e.dataTransfer.setData('text/plain', id)}
                                            selected={selectedStudent === id}
                                            onClick={() => setSelectedStudent(selectedStudent === id ? null : id)} />;
                                    })}
                                    {draft.unassigned.length === 0 && <span className="text-xs text-slate-300">모든 학생이 배정되었습니다</span>}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                {draft.groups.map((g, idx) => (
                                    <GroupCluster key={g.id} group={g} idx={idx} students={students} interactive
                                        dropReady={dragOverGroupId === g.id}
                                        onDragOverAllow={allowDrop(g.id)} onDropStudent={handleDropOnGroup(g.id)}>
                                        <div onClick={() => handleGroupClick(g.id)} className={selectedStudent ? 'cursor-pointer' : ''}>
                                            <div className="flex justify-between items-center">
                                                <input value={g.name} onClick={e => e.stopPropagation()} onChange={e => renameGroup(g.id, e.target.value)}
                                                    className="font-bold text-sm border-b border-transparent hover:border-slate-300 focus:border-indigo-500 outline-none bg-transparent w-24" />
                                                <button onClick={(e) => { e.stopPropagation(); removeGroup(g.id); }} className="text-[10px] text-rose-500 hover:underline">모둠 삭제</button>
                                            </div>
                                        </div>
                                    </GroupCluster>
                                ))}
                            </div>
                        </div>
                    )}

                    <h4 className="font-bold text-sm text-slate-700 mb-3">저장된 모둠 배정 회차</h4>
                    <div className="space-y-3">
                        {data.rounds.map(r => (
                            <div key={r.id} className="border border-slate-200 rounded-xl bg-white">
                                <div className="flex justify-between items-center p-3 cursor-pointer" onClick={() => setExpandedRoundId(expandedRoundId === r.id ? null : r.id)}>
                                    <div>
                                        <span className="font-bold text-sm">{r.name}</span>
                                        <span className="text-xs text-slate-400 ml-2">{r.date} · 모둠 {r.groups.length}개</span>
                                    </div>
                                    <div className="flex gap-1">
                                        <button onClick={(e) => { e.stopPropagation(); editRound(r); }} className="text-[10px] px-2 py-1 bg-indigo-50 text-indigo-700 rounded hover:bg-indigo-100 font-medium">수정</button>
                                        <button onClick={(e) => { e.stopPropagation(); deleteRound(r.id); }} className="text-[10px] px-2 py-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100 font-medium">삭제</button>
                                    </div>
                                </div>
                                {expandedRoundId === r.id && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 p-3 pt-0">
                                        {r.groups.map((g, idx) => (
                                            <GroupCluster key={g.id} group={g} idx={idx} students={students} interactive={false}>
                                                <p className="font-bold text-sm">{g.name}</p>
                                            </GroupCluster>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ))}
                        {data.rounds.length === 0 && <p className="text-sm text-slate-400">아직 저장된 모둠 배정이 없습니다.</p>}
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------------
        // Group record tab
        // ---------------------------------------------------------------
        function GroupRecordTab({ data, updateData }) {
            const rounds = data.rounds;
            const [roundId, setRoundId] = useState(rounds[0]?.id || '');
            useEffect(() => { if (!rounds.find(r => r.id === roundId)) setRoundId(rounds[0]?.id || ''); }, [rounds]);
            const round = rounds.find(r => r.id === roundId);
            const [formByGroup, setFormByGroup] = useState({});

            const addRecord = (groupId) => {
                const f = formByGroup[groupId] || { date: todayStr(), content: '' };
                if (!f.content.trim()) return;
                updateData(prev => ({ ...prev, groupRecords: [{ id: uid(), roundId, groupId, date: f.date || todayStr(), content: f.content.trim(), createdAt: Date.now() }, ...prev.groupRecords] }));
                setFormByGroup({ ...formByGroup, [groupId]: { date: todayStr(), content: '' } });
            };
            const deleteRecord = (id) => updateData(prev => ({ ...prev, groupRecords: prev.groupRecords.filter(r => r.id !== id) }));

            return (
                <div>
                    <h3 className="text-lg font-bold text-slate-900 mb-4">모둠 활동 기록</h3>
                    {rounds.length === 0 ? (
                        <p className="text-sm text-slate-500">먼저 모둠 배정 탭에서 회차를 만들어주세요.</p>
                    ) : (
                        <React.Fragment>
                            <select value={roundId} onChange={e => setRoundId(e.target.value)} className="border rounded-lg px-3 py-2 text-sm mb-6">
                                {rounds.map(r => <option key={r.id} value={r.id}>{r.name} ({r.date})</option>)}
                            </select>
                            {round && (
                                <div className="space-y-6">
                                    {round.groups.map((g, idx) => {
                                        const records = data.groupRecords.filter(r => r.roundId === round.id && r.groupId === g.id).sort((a, b) => b.createdAt - a.createdAt);
                                        const f = formByGroup[g.id] || { date: todayStr(), content: '' };
                                        const pal = paletteFor(idx);
                                        return (
                                            <div key={g.id} className={`border-2 rounded-xl bg-white p-4 ${pal.border}`}>
                                                <div className={`flex items-center gap-2 mb-2 -m-4 mb-3 px-4 py-2 rounded-t-lg ${pal.bg}`}>
                                                    <span className={`w-2.5 h-2.5 rounded-full ${pal.dot}`}></span>
                                                    <h4 className={`font-bold text-sm ${pal.text}`}>{g.name}</h4>
                                                </div>
                                                <div className="flex flex-wrap gap-1.5 mb-3">
                                                    {g.memberIds.map(id => {
                                                        const s = data.students.find(st => st.id === id);
                                                        return s ? <MemberChip key={id} student={s} /> : null;
                                                    })}
                                                    {g.memberIds.length === 0 && <span className="text-xs text-slate-300">구성원 없음</span>}
                                                </div>
                                                <div className="flex flex-wrap gap-2 mb-3">
                                                    <input type="date" value={f.date} onChange={e => setFormByGroup({ ...formByGroup, [g.id]: { ...f, date: e.target.value } })} className="border rounded-lg px-2 py-1.5 text-xs" />
                                                    <textarea value={f.content} onChange={e => setFormByGroup({ ...formByGroup, [g.id]: { ...f, content: e.target.value } })} placeholder="활동 내용 및 관찰 기록" rows="2" className="flex-1 min-w-[220px] border rounded-lg px-3 py-1.5 text-sm" />
                                                    <button onClick={() => addRecord(g.id)} className="bg-indigo-600 text-white text-xs font-bold px-4 py-1.5 rounded-lg hover:bg-indigo-700">기록 추가</button>
                                                </div>
                                                <div className="space-y-2">
                                                    {records.map(r => (
                                                        <div key={r.id} className="flex justify-between items-start bg-slate-50 rounded-lg p-2.5 border border-slate-100">
                                                            <div>
                                                                <span className="text-[10px] text-slate-400 font-bold">{r.date}</span>
                                                                <p className="text-sm text-slate-700">{r.content}</p>
                                                            </div>
                                                            <button onClick={() => deleteRecord(r.id)} className="text-[10px] text-rose-500 hover:underline shrink-0 ml-2">삭제</button>
                                                        </div>
                                                    ))}
                                                    {records.length === 0 && <p className="text-xs text-slate-300">기록 없음</p>}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </React.Fragment>
                    )}
                </div>
            );
        }

        // ---------------------------------------------------------------
        // Individual record tab
        // ---------------------------------------------------------------
        function IndividualRecordTab({ data, updateData }) {
            const students = useMemo(() => [...data.students].sort(byNumberThenName), [data.students]);
            const [studentId, setStudentId] = useState(students[0]?.id || '');
            useEffect(() => { if (!students.find(s => s.id === studentId)) setStudentId(students[0]?.id || ''); }, [students]);
            const [form, setForm] = useState({ category: RECORD_CATEGORIES[0], date: todayStr(), roundId: '', content: '' });
            const [search, setSearch] = useState('');

            const filteredStudents = students.filter(s => s.name.includes(search) || String(s.number).includes(search));
            const records = data.individualRecords.filter(r => r.studentId === studentId).sort((a, b) => b.createdAt - a.createdAt);

            const addRecord = () => {
                if (!studentId || !form.content.trim()) return;
                updateData(prev => ({ ...prev, individualRecords: [{ id: uid(), studentId, category: form.category, date: form.date || todayStr(), roundId: form.roundId || null, content: form.content.trim(), createdAt: Date.now() }, ...prev.individualRecords] }));
                setForm({ ...form, content: '' });
            };
            const deleteRecord = (id) => updateData(prev => ({ ...prev, individualRecords: prev.individualRecords.filter(r => r.id !== id) }));

            const exportText = () => {
                const s = students.find(s => s.id === studentId);
                if (!s) return;
                const lines = records.map(r => `[${r.date}] (${r.category}) ${r.content}`).join('\n');
                downloadFile(`${s.name}_생기부기록.txt`, `${s.name} (${s.number}번) 기록\n\n${lines}`, 'text/plain');
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="학생 검색" className="w-full border rounded-lg px-3 py-2 text-sm mb-2" />
                        <div className="border border-slate-200 rounded-xl bg-white max-h-[28rem] overflow-y-auto">
                            {filteredStudents.map(s => (
                                <button key={s.id} onClick={() => setStudentId(s.id)} className={`w-full text-left px-3 py-2 text-sm border-b border-slate-50 hover:bg-slate-50 ${studentId === s.id ? 'bg-indigo-50 text-indigo-700 font-bold' : ''}`}>
                                    {s.number ? `${s.number}번 ` : ''}{s.name}
                                </button>
                            ))}
                            {filteredStudents.length === 0 && <p className="text-xs text-slate-400 p-3">학생이 없습니다.</p>}
                        </div>
                    </div>
                    <div className="md:col-span-2">
                        {!studentId ? (
                            <p className="text-sm text-slate-500">학생을 먼저 선택하세요.</p>
                        ) : (
                            <React.Fragment>
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-lg font-bold text-slate-900">{studentLabel(students, studentId)}의 기록</h3>
                                    <button onClick={exportText} className="text-xs bg-slate-100 px-3 py-1.5 rounded-lg font-bold hover:bg-slate-200">📄 텍스트로 내보내기</button>
                                </div>
                                <div className="p-4 bg-white border border-slate-200 rounded-xl mb-4">
                                    <div className="flex flex-wrap gap-2 mb-2">
                                        <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} className="border rounded-lg px-2 py-1.5 text-xs">
                                            {RECORD_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} className="border rounded-lg px-2 py-1.5 text-xs" />
                                        <select value={form.roundId} onChange={e => setForm({ ...form, roundId: e.target.value })} className="border rounded-lg px-2 py-1.5 text-xs">
                                            <option value="">관련 회차 없음</option>
                                            {data.rounds.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                        </select>
                                    </div>
                                    <textarea value={form.content} onChange={e => setForm({ ...form, content: e.target.value })} rows="3" placeholder="관찰 및 특기사항을 입력하세요" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                    <div className="flex justify-end mt-2">
                                        <button onClick={addRecord} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-700">기록 추가</button>
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    {records.map(r => (
                                        <div key={r.id} className="flex justify-between items-start bg-white border border-slate-100 rounded-lg p-3">
                                            <div>
                                                <span className="text-[10px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold mr-1">{r.category}</span>
                                                <span className="text-[10px] text-slate-400 font-bold">{r.date}</span>
                                                <p className="text-sm text-slate-700 mt-1">{r.content}</p>
                                            </div>
                                            <button onClick={() => deleteRecord(r.id)} className="text-[10px] text-rose-500 hover:underline shrink-0 ml-2">삭제</button>
                                        </div>
                                    ))}
                                    {records.length === 0 && <p className="text-xs text-slate-300">기록 없음</p>}
                                </div>
                            </React.Fragment>
                        )}
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------------
        // Settings tab
        // ---------------------------------------------------------------
        function SettingsTab({ classCode, firebaseConfigText, setFirebaseConfigText, applyFirebaseConfig, connected, googleClientId, setGoogleClientId, google, data, updateData }) {
            const [exportBusy, setExportBusy] = useState(false);
            const [exportMsg, setExportMsg] = useState('');
            const fileInputRef = useRef(null);

            const doExport = async () => {
                if (!google.token) { google.signIn(); return; }
                setExportBusy(true); setExportMsg('');
                try {
                    const { url } = await exportToSheet(google.token, data, '모둠·생기부 기록');
                    setExportMsg('내보내기 완료: ' + url);
                } catch (e) { setExportMsg(e.message); }
                finally { setExportBusy(false); }
            };

            const backupJson = () => downloadFile(`모둠생기부_백업_${todayStr()}.json`, JSON.stringify(data, null, 2));
            const restoreJson = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        if (!window.confirm('현재 데이터를 백업 파일 내용으로 덮어씁니다. 계속할까요?')) return;
                        updateData(() => ({ ...DEFAULT_DATA, ...parsed }));
                    } catch (err) { alert('올바른 백업 파일이 아닙니다.'); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="space-y-8 max-w-2xl">
                    <section>
                        <h3 className="text-lg font-bold text-slate-900 mb-2">🔄 여러 기기 동기화 (Firebase)</h3>
                        <p className="text-xs text-slate-500 mb-3">Firebase 프로젝트를 만들고 Firestore 설정을 붙여넣으면, 같은 학급 코드를 쓰는 모든 기기(PC·태블릿·휴대폰)에서 실시간으로 데이터가 동기화됩니다. 설정하지 않아도 이 브라우저에서는 계속 사용할 수 있어요.</p>
                        <textarea value={firebaseConfigText} onChange={e => setFirebaseConfigText(e.target.value)} rows="6" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}' className="w-full border rounded-lg px-3 py-2 text-xs font-mono" />
                        <div className="flex items-center gap-2 mt-2">
                            <button onClick={applyFirebaseConfig} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-700">적용</button>
                            <span className={`text-xs font-bold ${connected ? 'text-emerald-600' : 'text-slate-400'}`}>{connected ? '● 연결됨' : '○ 미연결(로컬 저장 모드)'}</span>
                        </div>
                    </section>

                    <section>
                        <h3 className="text-lg font-bold text-slate-900 mb-2">📊 구글 스프레드시트 연동</h3>
                        <p className="text-xs text-slate-500 mb-3">Google Cloud Console에서 만든 OAuth 클라이언트 ID를 입력하면, 명단/모둠배정/기록을 스프레드시트로 내보내거나 명단을 불러올 수 있습니다.</p>
                        <input value={googleClientId} onChange={e => setGoogleClientId(e.target.value)} placeholder="Google OAuth 클라이언트 ID" className="w-full border rounded-lg px-3 py-2 text-sm" />
                        <div className="flex items-center gap-2 mt-2">
                            <button onClick={() => google.signIn()} className="bg-white border border-slate-300 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-50">{google.token ? 'Google 재인증' : 'Google 계정 연결'}</button>
                            <button onClick={doExport} disabled={exportBusy} className="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-emerald-700 disabled:opacity-50">{exportBusy ? '내보내는 중...' : '전체 데이터 시트로 내보내기'}</button>
                        </div>
                        {(google.error || exportMsg) && <p className="text-xs text-slate-500 mt-2 break-all">{google.error || exportMsg}</p>}
                    </section>

                    <section>
                        <h3 className="text-lg font-bold text-slate-900 mb-2">💾 백업 파일</h3>
                        <p className="text-xs text-slate-500 mb-3">Firebase나 구글 계정 없이도 전체 데이터를 파일로 저장하고 불러올 수 있습니다.</p>
                        <div className="flex items-center gap-2">
                            <button onClick={backupJson} className="bg-white border border-slate-300 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-50">백업 파일 저장</button>
                            <button onClick={() => fileInputRef.current.click()} className="bg-white border border-slate-300 text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-50">백업 파일 불러오기</button>
                            <input ref={fileInputRef} type="file" accept="application/json" onChange={restoreJson} className="hidden" />
                        </div>
                    </section>
                </div>
            );
        }

        // ---------------------------------------------------------------
        // App shell
        // ---------------------------------------------------------------
        function App() {
            const [classCode, setClassCode] = useState(localStorage.getItem('sga_classCode') || 'default');
            const [inputCode, setInputCode] = useState('');
            const [firebaseConfigText, setFirebaseConfigText] = useState(localStorage.getItem('sga_firebaseConfig') || '');
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sga_firebaseConfig') || 'null'); } catch (e) { return null; }
            });
            const [googleClientId, setGoogleClientIdState] = useState(localStorage.getItem('sga_googleClientId') || '');
            const [db, setDb] = useState(null);
            const [connected, setConnected] = useState(false);
            const [data, setData] = useState(DEFAULT_DATA);
            const [activeTab, setActiveTab] = useState('roster');

            const google = useGoogleAuth(googleClientId);

            const setGoogleClientId = (val) => { setGoogleClientIdState(val); localStorage.setItem('sga_googleClientId', val); };

            const applyFirebaseConfig = () => {
                try {
                    const parsed = firebaseConfigText.trim() ? JSON.parse(firebaseConfigText) : null;
                    setFirebaseConfig(parsed);
                    localStorage.setItem('sga_firebaseConfig', parsed ? JSON.stringify(parsed) : '');
                } catch (e) { alert('올바른 JSON 형식이 아닙니다.'); }
            };

            useEffect(() => {
                if (!firebaseConfig) { setDb(null); setConnected(false); return; }
                try {
                    const app = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(firebaseConfig);
                    const firestore = window.firebase.firestore();
                    window.firebase.auth().signInAnonymously().catch(err => console.error('anon auth failed', err));
                    setDb(firestore);
                } catch (e) {
                    console.error(e);
                    setDb(null);
                    setConnected(false);
                }
            }, [firebaseConfig]);

            useEffect(() => {
                if (!db || !classCode) return;
                const unsub = db.collection('classes').doc(classCode).onSnapshot(
                    snap => {
                        setConnected(true);
                        if (snap.exists) setData({ ...DEFAULT_DATA, ...snap.data() });
                        else db.collection('classes').doc(classCode).set(DEFAULT_DATA);
                    },
                    err => { console.error(err); setConnected(false); }
                );
                return () => unsub();
            }, [db, classCode]);

            useEffect(() => {
                if (db) return;
                const raw = localStorage.getItem(`sga_data_${classCode}`);
                setData(raw ? { ...DEFAULT_DATA, ...JSON.parse(raw) } : DEFAULT_DATA);
            }, [classCode, db]);

            const updateData = (updater) => {
                setData(prev => {
                    const next = typeof updater === 'function' ? updater(prev) : updater;
                    if (db && classCode) {
                        db.collection('classes').doc(classCode).set(next).catch(err => console.error('sync write failed', err));
                    } else {
                        localStorage.setItem(`sga_data_${classCode}`, JSON.stringify(next));
                    }
                    return next;
                });
            };

            const connectClass = (e) => {
                e.preventDefault();
                if (!inputCode.trim()) return;
                const code = inputCode.trim();
                setClassCode(code);
                localStorage.setItem('sga_classCode', code);
                setInputCode('');
            };

            const TABS = [
                { id: 'roster', label: '👥 명단관리' },
                { id: 'assign', label: '🎲 모둠배정' },
                { id: 'grouprecord', label: '📝 모둠기록' },
                { id: 'indivrecord', label: '🧑 개인기록' },
                { id: 'settings', label: '⚙️ 설정' },
            ];

            return (
                <div className="min-h-screen bg-slate-50">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
                            <div className="flex items-center gap-3">
                                <span className="text-2xl">🧩</span>
                                <h1 className="text-lg sm:text-xl font-bold text-indigo-600">모둠 배정 &amp; 생기부 기록</h1>
                                <span className="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-semibold border border-indigo-100">{classCode}</span>
                                <span className={`text-xs font-bold ${connected ? 'text-emerald-600' : 'text-slate-400'}`}>{connected ? '● 동기화됨' : '○ 이 기기에만 저장'}</span>
                            </div>
                            <form onSubmit={connectClass} className="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200">
                                <input type="text" placeholder="학급 코드 입력 (예: 6-3)" value={inputCode} onChange={e => setInputCode(e.target.value)} className="bg-transparent text-xs px-2 py-1 outline-none w-32 focus:w-40 transition-all" />
                                <button type="submit" className="bg-slate-700 text-white text-xs px-2.5 py-1 rounded-md hover:bg-slate-800">이동</button>
                            </form>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-6">
                        <div className="flex border-b border-slate-200 mb-6 overflow-x-auto whitespace-nowrap">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`px-5 py-3 border-b-2 font-medium text-sm transition-all ${activeTab === tab.id ? 'border-indigo-600 text-indigo-600 font-bold' : 'border-transparent text-slate-500'}`}>
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                            {activeTab === 'roster' && <RosterTab data={data} updateData={updateData} google={{ ...google, clientId: googleClientId }} />}
                            {activeTab === 'assign' && <AssignTab data={data} updateData={updateData} />}
                            {activeTab === 'grouprecord' && <GroupRecordTab data={data} updateData={updateData} />}
                            {activeTab === 'indivrecord' && <IndividualRecordTab data={data} updateData={updateData} />}
                            {activeTab === 'settings' && (
                                <SettingsTab
                                    classCode={classCode}
                                    firebaseConfigText={firebaseConfigText}
                                    setFirebaseConfigText={setFirebaseConfigText}
                                    applyFirebaseConfig={applyFirebaseConfig}
                                    connected={connected}
                                    googleClientId={googleClientId}
                                    setGoogleClientId={setGoogleClientId}
                                    google={google}
                                    data={data}
                                    updateData={updateData}
                                />
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
